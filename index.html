<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AmbuCheck – Contrôle des ambulances</title>
<meta name="theme-color" content="#0E1F3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AmbuCheck">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%231F5AA6'/%3E%3Cpath d='M42 20h16v22h22v16H58v22H42V58H20V42h22z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1F3A;--ink-2:#33425C;--muted:#62708A;--line:#DCE3EC;--canvas:#EEF2F6;--surface:#FFFFFF;
  --blue:#1F5AA6;--blue-d:#174683;--blue-2:#E6EEF9;
  --go:#0E9467;--go-2:#E1F4EC;--warn:#D9690B;--warn-2:#FCEEDF;--stop:#D3303B;--stop-2:#FBE5E7;--grey-2:#EEF1F5;
  --r-lg:22px;--r-md:14px;--r-sm:10px;
  --shadow:0 1px 2px rgba(14,31,58,.06),0 6px 18px rgba(14,31,58,.06);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--canvas);color:var(--ink);font:16px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #8DB4EA;outline-offset:2px}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;stroke-width:2.2;flex:none}
.cond{font-family:"Barlow Semi Condensed",Barlow,system-ui,sans-serif}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:30px;font-weight:800}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:14px}.tiny{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.stack>*+*{margin-top:12px}
.hide{display:none!important}

/* ---------- Shell ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;padding:calc(10px + var(--safe-t)) 18px 10px}
.top .tin{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
.brand .mark{width:32px;height:32px;border-radius:9px;background:var(--blue);display:grid;place-items:center}
.brand .mark svg{width:18px;height:18px}
.top .who{font-size:13px;opacity:.8;text-align:right;line-height:1.2}
.iconbtn{background:rgba(255,255,255,.1);border:0;color:#fff;width:38px;height:38px;border-radius:11px;display:grid;place-items:center}
.layout{max-width:1180px;margin:0 auto;display:flex;gap:24px;padding:18px 16px calc(96px + var(--safe-b))}
.side{display:none}
main{flex:1;min-width:0}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + var(--safe-b))}
.bnav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:12px;font-weight:600;color:var(--muted);border-radius:12px;position:relative}
.bnav button .ic{width:24px;height:24px}
.bnav button.on{color:var(--blue)}
.bnav button.on::before{content:"";position:absolute;top:-6px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--blue)}
.dotn{position:absolute;top:2px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--stop);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
@media(min-width:960px){
  .side{display:block;width:230px;flex:none}
  .side nav{position:sticky;top:84px;display:flex;flex-direction:column;gap:4px}
  .side button{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-radius:12px;background:none;font-weight:600;color:var(--ink-2);text-align:left;position:relative}
  .side button .ic{width:20px;height:20px}
  .side button.on{background:var(--surface);color:var(--blue);box-shadow:var(--shadow)}
  .side .dotn{position:static;margin-left:auto}
  .bnav{display:none}
  .layout{padding-bottom:40px}
}

/* ---------- Surfaces ---------- */
.card{background:var(--surface);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.sect{margin-top:26px}
.sect>h2,.sect>.row>h2{margin-bottom:12px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border-radius:var(--r-md);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .n{font-family:"Barlow Semi Condensed",Barlow,system-ui,sans-serif;font-size:34px;font-weight:700;line-height:1}
.kpi .l{font-size:14px;color:var(--muted);margin-top:4px}
.kpi .m{font-size:13px;color:var(--ink-2);margin-top:6px}
.kpi.stop .n{color:var(--stop)}.kpi.warn .n{color:var(--warn)}

/* ---------- Plate (signature element) ---------- */
.plate{display:inline-flex;align-items:stretch;border:2px solid var(--ink);border-radius:7px;overflow:hidden;background:#fff;font-family:"Barlow Semi Condensed",Barlow,system-ui,sans-serif;font-weight:700;font-size:15px;line-height:1;height:28px;flex:none}
.plate .eu{background:#1D3E9E;color:#fff;font-size:10px;padding:0 4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:3px}
.plate .eu::before{content:"★";font-size:8px;color:#FFD400;margin-bottom:auto;margin-top:2px}
.plate .num{padding:0 9px;display:flex;align-items:center;letter-spacing:.04em;text-transform:uppercase}
.plate.big{height:38px;font-size:21px}.plate.big .eu{font-size:12px;padding:0 6px 4px}

/* ---------- Vehicle cards ---------- */
.veh{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.veh .band{height:8px;background:repeating-linear-gradient(90deg,var(--blue) 0 28px,#fff 28px 56px)}
.veh.busy .band{background:repeating-linear-gradient(90deg,var(--warn) 0 28px,#fff 28px 56px)}
.veh.off .band{background:#C6CEDA}
.veh .body{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1}
.veh .name{font-size:20px;font-weight:800}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;padding:5px 11px;border-radius:999px}
.status.go{background:var(--go-2);color:#0B7451}.status.busy{background:var(--warn-2);color:#A24D05}.status.off{background:var(--grey-2);color:var(--muted)}
.status.stop{background:var(--stop-2);color:#A41F29}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;font-weight:600;padding:3px 9px;border-radius:8px;background:var(--grey-2);color:var(--ink-2)}
.tag.blue{background:var(--blue-2);color:var(--blue-d)}.tag.warn{background:var(--warn-2);color:#A24D05}.tag.stop{background:var(--stop-2);color:#A41F29}.tag.go{background:var(--go-2);color:#0B7451}

/* ---------- Buttons ---------- */
.btn{border:0;border-radius:13px;padding:13px 18px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;min-height:48px;text-decoration:none}
.btn:hover{background:var(--blue-d)}
.btn.sec{background:var(--blue-2);color:var(--blue-d)}
.btn.ghost{background:transparent;color:var(--ink-2);border:1.5px solid var(--line)}
.btn.go{background:var(--go)}.btn.warn{background:var(--warn)}.btn.stop{background:var(--stop)}
.btn.sm{min-height:36px;padding:7px 12px;font-size:14px;border-radius:10px}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--blue);font-weight:700;padding:0}

/* ---------- Hero (employee) ---------- */
.hello{padding:4px 2px 2px}
.hello h1{font-size:32px}
.hello p{color:var(--muted);text-transform:none}
.mission{background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.mission::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;border:18px solid rgba(255,255,255,.06)}
.mission .t{font-size:22px;font-weight:800}
.mission .s{opacity:.8}
.reminder{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);background:var(--warn-2);color:#7A3A04}
.reminder.stop{background:var(--stop-2);color:#8A1820}
.reminder.info{background:var(--blue-2);color:var(--blue-d)}
.reminder .ic{margin-top:2px}

/* ---------- Forms ---------- */
label.f{display:block;font-size:14px;font-weight:600;color:var(--ink-2);margin:14px 0 6px}
.in{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;background:#fff;min-height:48px}
.in:focus{border-color:var(--blue);outline:none}
textarea.in{min-height:96px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
.seg{display:flex;background:var(--grey-2);border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.seg button:disabled{opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.chips button.on{background:var(--blue);border-color:var(--blue);color:#fff}

/* ---------- Auth ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr;background:var(--ink)}
.auth .art{color:#fff;padding:calc(28px + var(--safe-t)) 24px 30px;display:flex;flex-direction:column;gap:14px}
.auth .art h1{font-size:40px;font-weight:800;max-width:12ch}
.auth .art p{opacity:.75;max-width:36ch}
.auth .art .band{height:12px;border-radius:6px;background:repeating-linear-gradient(90deg,var(--blue) 0 36px,#fff 36px 72px);max-width:340px;margin-top:6px}
.auth .panel{background:var(--canvas);border-radius:28px 28px 0 0;padding:26px 20px calc(30px + var(--safe-b))}
.auth .panel .box{max-width:420px;margin:0 auto}
@media(min-width:900px){.auth{grid-template-columns:1.1fr 1fr}.auth .art{justify-content:center;padding:60px}.auth .art h1{font-size:56px}.auth .panel{border-radius:0;display:flex;align-items:center}}

/* ---------- Wizard ---------- */
.wz{max-width:640px;margin:0 auto}
.wzhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.prog{display:flex;gap:6px;margin:4px 0 18px}
.prog span{flex:1;height:6px;border-radius:3px;background:#D5DDE8}
.prog span.done{background:var(--go)}.prog span.cur{background:var(--blue)}
.steptitle{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.steptitle .ico{width:44px;height:44px;border-radius:13px;background:var(--blue-2);color:var(--blue);display:grid;place-items:center}
.steptitle .ico .ic{width:24px;height:24px}
.wzfoot{position:fixed;left:0;right:0;bottom:0;z-index:31;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + var(--safe-b))}
.wzfoot .in2{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
.wzfoot .hint{flex:1;font-size:13px;color:var(--muted)}
.shots{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:600px){.shots{grid-template-columns:repeat(3,1fr)}}
.shot{position:relative;aspect-ratio:4/3;border-radius:16px;border:2px dashed #AFC0D6;background:#F7F9FC;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;overflow:hidden;font-weight:700;font-size:14px;color:var(--ink-2);text-align:center;padding:8px}
.shot .ic{width:28px;height:28px;color:var(--blue)}
.shot.ok{border:2px solid var(--go)}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;padding:18px 8px 7px;font-size:13px;text-align:left}
.shot .req{position:absolute;top:7px;right:7px;font-size:11px;background:var(--ink);color:#fff;border-radius:6px;padding:2px 6px}
.shot.ok .req{background:var(--go)}
.shot.busy::after{content:"Envoi…";position:absolute;inset:0;background:rgba(255,255,255,.85);display:grid;place-items:center;color:var(--blue);font-weight:800}
.shot input,.addph input{display:none}
.checkgroup{background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow);margin-top:14px;overflow:hidden}
.checkgroup .gh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.checkgroup .gh h3{flex:1}
.counter{font-family:"Barlow Semi Condensed",Barlow,system-ui,sans-serif;font-weight:700;font-size:15px;color:var(--muted)}
.counter.full{color:var(--go)}.counter.pb{color:var(--stop)}
.ck{padding:12px 16px;border-bottom:1px solid #EEF1F5}
.ck:last-child{border-bottom:0}
.ck .q{display:flex;align-items:center;gap:12px}
.ck .lab{flex:1;font-weight:500}
.tog{display:flex;gap:6px;flex:none}
.tog button{border:1.5px solid var(--line);background:#fff;border-radius:11px;min-width:54px;height:42px;padding:0 10px;font-weight:700;font-size:14px;color:var(--ink-2)}
.tog button.on.ok{background:var(--go);border-color:var(--go);color:#fff}
.tog button.on.pb,.tog button.on.abs{background:var(--stop);border-color:var(--stop);color:#fff}
.tog button.on.def{background:var(--warn);border-color:var(--warn);color:#fff}
.decl{display:none;margin-top:10px;background:var(--stop-2);border-radius:12px;padding:12px}
.ck.need .decl{display:block}
.decl .row{margin-top:8px}
.addph{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;color:var(--stop);cursor:pointer}
.decl img{width:64px;height:48px;object-fit:cover;border-radius:8px}
@media(max-width:420px){.ck .q{flex-wrap:wrap}.tog{width:100%}.tog button{flex:1}}

/* ---------- Lists / tables ---------- */
.list>.li{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #EEF1F5}
.list>.li:last-child{border-bottom:0}
.list>.li.click{cursor:pointer}
.li .ttl{font-weight:700}
.badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--grey-2);color:var(--ink-2)}
.badge.stop{background:var(--stop-2);color:var(--stop)}.badge.warn{background:var(--warn-2);color:var(--warn)}.badge.go{background:var(--go-2);color:var(--go)}.badge.blue{background:var(--blue-2);color:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #EEF1F5;vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600}
.tw{overflow-x:auto}
.subtabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
.subtabs button{border:0;background:#fff;border-radius:999px;padding:9px 15px;font-weight:700;font-size:14px;color:var(--ink-2);white-space:nowrap;box-shadow:var(--shadow)}
.subtabs button.on{background:var(--ink);color:#fff}

/* ---------- Calendar ---------- */
.cal{max-width:620px;background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow);padding:14px}
.calh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.calh h3{flex:1;text-transform:capitalize}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calg .dn{font-size:12px;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.day{aspect-ratio:1/1;border:0;border-radius:11px;background:#F5F7FA;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 2px 5px;font-weight:700;font-size:15px;color:var(--ink);min-height:44px}
.day.out{visibility:hidden}
.day.today{box-shadow:inset 0 0 0 2px var(--blue)}
.day.sel{background:var(--ink);color:#fff}
.day .dots{display:flex;gap:3px;height:6px}
.day .dots i{width:6px;height:6px;border-radius:50%;display:block}
.d-blue{background:var(--blue)}.d-go{background:var(--go)}.d-warn{background:var(--warn)}.d-stop{background:var(--stop)}.d-ink{background:var(--ink-2)}
.legend{max-width:620px;display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* ---------- Photos compare ---------- */
.cmp{max-width:780px;display:grid;grid-template-columns:110px 1fr 1fr;gap:8px;align-items:center;margin-top:8px}
.cmp img,.cmp .none{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--grey-2);cursor:zoom-in}
.cmp .none{display:grid;place-items:center;font-size:12px;color:var(--muted);cursor:default}
@media(max-width:520px){.cmp{grid-template-columns:72px 1fr 1fr}}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs img{width:84px;height:63px;object-fit:cover;border-radius:9px;cursor:zoom-in;background:var(--grey-2)}

/* ---------- Overlays ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(14,31,58,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(22px + var(--safe-b));animation:up .22s ease-out}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet .sh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet .sh h2{flex:1}
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:14px;margin-top:10px}
.choice:hover{border-color:var(--blue)}
.choice .t{font-weight:800;font-size:17px}
.lb{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px}
.lb img{max-width:100%;max-height:84vh;border-radius:10px}
.lb p{color:#fff;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);z-index:80;background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:92vw;text-align:center}
.toast.err{background:var(--stop)}
.empty{text-align:center;padding:34px 14px;color:var(--muted)}
.empty .ic{width:40px;height:40px;color:#AFC0D6;margin-bottom:8px}
.banner{border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:15px}
.banner.warn{background:var(--warn-2);color:#7A3A04}.banner.stop{background:var(--stop-2);color:#8A1820}
@media print{.top,.bnav,.side,.btn,.wzfoot,.noprint{display:none!important}body{background:#fff}.card,.cal{box-shadow:none;border:1px solid #ccc}}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

/* ---------------- Photos (stockées dans Firestore) ---------------- */
const phCache={};
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Image illisible'));i.src=u})}
async function photoData(file,label){
  const img=await loadImg(file);let max=1400,q=.72,out='';
  for(let k=0;k<7;k++){
    let w=img.naturalWidth,h=img.naturalHeight;const sc=Math.min(1,max/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);
    const fs=Math.max(14,Math.round(w/42));x.font='600 '+fs+'px Barlow,sans-serif';
    const txt=label+'  '+new Date().toLocaleString('fr-FR');const tw=x.measureText(txt).width;
    x.fillStyle='rgba(14,31,58,.7)';x.fillRect(0,h-fs*1.9,tw+fs*1.2,fs*1.9);x.fillStyle='#fff';x.fillText(txt,fs*.6,h-fs*.6);
    out=c.toDataURL('image/jpeg',q); if(out.length<420000)break; max=Math.round(max*.85); q=Math.max(.45,q-.06);
  }
  return out;
}
async function savePhoto(file,label){
  const d=await photoData(file,label);
  const ref=P.db.collection('photos').doc();
  await ref.set({d,uid:P.uid,t:Date.now()});
  phCache[ref.id]=d; return ref.id;
}
function img(id,cap=''){
  if(!id)return '<div class="none">Pas de photo</div>';
  return `<img data-ph="${esc(id)}" ${phCache[id]?`src="${phCache[id]}"`:''} data-act="zoom" data-cap="${esc(cap)}" alt="${esc(cap)}">`;
}
async function hydrate(){
  const els=[...document.querySelectorAll('img[data-ph]:not([src])')];
  const ids=[...new Set(els.map(e=>e.dataset.ph))];
  await Promise.all(ids.map(async id=>{
    if(!phCache[id]){try{const s=await P.db.doc('photos/'+id).get();phCache[id]=s.exists?s.data().d:''}catch(e){phCache[id]=''}}
    if(phCache[id])document.querySelectorAll(`img[data-ph="${id}"]`).forEach(i=>i.src=phCache[id]);
  }));
}

const uName = id => (S.users.find(u=>u.id===id)||{}).name||'';
const departs = vid => S.insp.filter(i=>i.kind==='depart'&&(!vid||i.vehicleId===vid));
const retourOf = depId => S.insp.find(i=>i.kind==='retour'&&i.departId===depId);
const vState = v => (v&&v.state)||{status:'free'};
const inUse = v => vState(v).status==='in_use';
function curKm(v){let k=Number(v.km)||0;S.insp.forEach(i=>{if(i.vehicleId===v.id&&Number(i.km)>k)k=Number(i.km)});return k}
function lastLevel(vid,levels){return departs(vid).find(i=>levels.includes(i.level))||null}
function dueInfo(vid){
  const today=dkey();
  const l15=lastLevel(vid,['15j','monthly']),lm=lastLevel(vid,['monthly']);
  const n15=l15?addDays(l15.date,15):today, nm=lm?addDays(lm.date,30):today;
  return {l15,lm,n15,nm,due15:n15<=today,dueM:nm<=today,late15:n15<today&&!!l15,lateM:nm<today&&!!lm,d15:diffDays(today,n15),dM:diffDays(today,nm)};
}
function maintItems(vid){
  const v=vById(vid);const km=v?curKm(v):0;const m=(S.maint[vid]&&S.maint[vid].items)||{};const today=dkey();
  return MAINT.map(([k,lbl,ik,id])=>{const it=m[k]||{};const intKm=it.intKm!==undefined?it.intKm:ik;const intD=it.intDays!==undefined?it.intDays:id;
    let st='none',nextKm=null,nextDate=null,remKm=null,remD=null;
    if(it.lastDate||it.lastKm!=null){st='ok';
      if(intKm&&it.lastKm!=null){nextKm=Number(it.lastKm)+Number(intKm);remKm=nextKm-km;if(remKm<0)st='stop';else if(remKm<=1500)st='warn'}
      if(intD&&it.lastDate){nextDate=addDays(it.lastDate,Number(intD));remD=diffDays(today,nextDate);if(remD<0)st='stop';else if(remD<=30&&st==='ok')st='warn'}
    }
    return {k,lbl,intKm,intD,last:it,nextKm,nextDate,remKm,remD,st,km};});
}
function equipFor(vid,level){
  return S.equip.filter(e=>(!e.vehicleId||e.vehicleId===vid)&&(e.levels||[]).includes(level)).map(e=>['eq_'+e.id,e.name+(e.qty?` (×${e.qty})`:'')]);
}
function alerts(){
  const A=[];const today=dkey();
  S.vehicles.forEach(v=>{
    const d=dueInfo(v.id);
    if(d.late15)A.push({lvl:'stop',ic:'calendar-x',t:`${v.name} : contrôle 15 jours en retard`,s:`Prévu le ${fDs(d.n15)}`,go:['vehicle',v.id]});
    else if(!d.l15)A.push({lvl:'warn',ic:'calendar-clock',t:`${v.name} : aucun contrôle 15 jours enregistré`,s:'À faire au prochain départ',go:['vehicle',v.id]});
    if(d.lateM)A.push({lvl:'stop',ic:'calendar-x',t:`${v.name} : contrôle mensuel en retard`,s:`Prévu le ${fDs(d.nm)}`,go:['vehicle',v.id]});
    maintItems(v.id).forEach(x=>{if(x.st==='stop')A.push({lvl:'stop',ic:'wrench',t:`${v.name} : ${x.lbl} en retard`,s:x.remKm!=null&&x.remKm<0?`Dépassé de ${nf(-x.remKm)} km`:`Depuis le ${fDs(x.nextDate)}`,go:['maint']});
      else if(x.st==='warn')A.push({lvl:'warn',ic:'wrench',t:`${v.name} : ${x.lbl} bientôt`,s:x.remKm!=null&&x.remKm<=1500?`Dans ${nf(x.remKm)} km`:`Le ${fDs(x.nextDate)}`,go:['maint']})});
    [['insuranceUntil','Assurance'],['ctUntil','Contrôle technique']].forEach(([f,l])=>{if(v[f]){const r=diffDays(today,v[f]);if(r<0)A.push({lvl:'stop',ic:'file-warning',t:`${v.name} : ${l} expiré`,s:`Depuis le ${fDs(v[f])}`,go:['vehicle',v.id]});else if(r<=30)A.push({lvl:'warn',ic:'file-clock',t:`${v.name} : ${l} expire bientôt`,s:`Le ${fDs(v[f])}`,go:['vehicle',v.id]})}});
    if(inUse(v)&&Date.now()-vState(v).since>14*3600e3)A.push({lvl:'warn',ic:'clock-alert',t:`${v.name} en service depuis plus de 14 h`,s:`Avec ${vState(v).byName}, retour non enregistré`,go:['vehicle',v.id]});
  });
  S.equip.forEach(e=>{if(e.expiry){const r=diffDays(today,e.expiry);const v=e.vehicleId?vById(e.vehicleId):null;const where=v?v.name:'Tous les véhicules';
    if(r<0)A.push({lvl:'stop',ic:'package-x',t:`${e.name} périmé`,s:`${where}, depuis le ${fDs(e.expiry)}`,go:['fleet','equip']});
    else if(r<=30)A.push({lvl:'warn',ic:'package',t:`${e.name} périme bientôt`,s:`${where}, le ${fDs(e.expiry)}`,go:['fleet','equip']})}});
  return A.sort((a,b)=>(a.lvl==='stop'?0:1)-(b.lvl==='stop'?0:1));
}

async function doSignup(){
  const name=$('#suN').value.trim(),em=$('#suE').value.trim().toLowerCase(),pw=$('#suP').value;
  if(!name||!em||pw.length<6)return toast('Remplissez le nom, l’e-mail et un mot de passe de 6 caractères minimum.',true);
  const btn=document.querySelector('#fSignup button[type=submit]');btn.disabled=true;S.settingUp=true;
  try{
    const cred=await P.auth.createUserWithEmailAndPassword(em,pw);const uid=cred.user.uid;
    let staff=null;try{const s=await P.db.doc('staff/'+em).get();if(s.exists)staff=s.data()}catch(e){}
    let role=staff?staff.role:pickedRole;const doc={name:(staff&&staff.name)||name,email:em,function:(staff&&staff.function)||'',role,createdAt:Date.now(),declared:!!staff};
    let note=staff?'Votre e-mail était enregistré : rôle '+(role==='admin'?'administrateur':'employé')+' appliqué.':'';
    if(role==='admin'){
      try{const a=await P.db.doc('config/admins').get();const uids=(a.exists&&a.data().uids)||[];
        if(uids.length>=2)throw new Error('full');
        const bt=P.db.batch();bt.set(P.db.doc('users/'+uid),doc);bt.set(P.db.doc('config/admins'),{uids:uids.concat([uid])});await bt.commit();

    }else await P.db.doc('users/'+uid).set(doc);
    S.settingUp=false;toast(note||'Compte créé. Bienvenue !');
  }catch(e){S.settingUp=false;btn.disabled=false;toast(errMsg(e),true)}
}

function vehCardEmp(v,assign){
  const st=vState(v);const busy=inUse(v);const off=v.status==='maintenance';const me=busy&&st.by===P.uid;const d=dueInfo(v.id);
  const todays=departs(v.id).filter(i=>i.date===dkey());

  let tags=[];if(assign[v.id]===P.uid)tags.push('<span class="tag blue">Attribuée à vous</span>');else if(assign[v.id])tags.push(`<span class="tag">Prévue pour ${esc(first(uName(assign[v.id])))}</span>`);
  if(d.dueM)tags.push(`<span class="tag ${d.lateM?'stop':'warn'}">Mensuel à faire</span>`);else if(d.due15)tags.push(`<span class="tag ${d.late15?'stop':'warn'}">15 jours à faire</span>`);
  if(todays.length)tags.push(`<span class="tag go">${todays.length} départ${todays.length>1?'s':''} aujourd’hui</span>`);

  else action=`<button class="btn full" data-act="chooseDep" data-id="${v.id}">${I('play')}Départ</button>`;

}

/* ---------------- Planning employé ---------------- */
function calendar(month,cellDots,sel){
  const [y,m]=month.split('-').map(Number);const firstD=new Date(y,m-1,1);const days=new Date(y,m,0).getDate();const off=(firstD.getDay()+6)%7;const today=dkey();
  let g=['L','M','M','J','V','S','D'].map(d=>`<div class="dn">${d}</div>`).join('');
  for(let i=0;i<off;i++)g+='<div class="day out"></div>';
  for(let d=1;d<=days;d++){const k=y+'-'+pad(m)+'-'+pad(d);const dots=cellDots(k)||[];
    g+=`<button class="day ${k===today?'today':''} ${k===sel?'sel':''}" data-act="calDay" data-d="${k}" aria-label="${esc(fD(k))}">${d}<span class="dots">${dots.slice(0,4).map(c=>`<i class="d-${c}"></i>`).join('')}</span></button>`}
  const label=firstD.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  return `<div class="cal"><div class="calh"><button class="btn sec sm" data-act="calNav" data-n="-1" aria-label="Mois précédent">${I('chevron-left')}</button><h3>${label}</h3><button class="btn sm ghost" data-act="calToday">Aujourd’hui</button><button class="btn sec sm" data-act="calNav" data-n="1" aria-label="Mois suivant">${I('chevron-right')}</button></div><div class="calg">${g}</div>`;
}
function vEmpPlan(){
  const today=dkey();
  const dots=k=>{const r=[];const a=(S.planning[k]&&S.planning[k].assign)||{};if(Object.values(a).includes(P.uid))r.push('blue');
    if(S.insp.some(i=>i.kind==='depart'&&i.date===k&&i.uid===P.uid))r.push('go');
    if(S.vehicles.some(v=>{const d=dueInfo(v.id);return(d.n15===k||d.nm===k)&&k>=today}))r.push('warn');return r};
  let out=`<h1>Planning</h1><p class="muted" style="margin:4px 0 16px">Vos affectations, vos contrôles et les prochains rappels.</p>`;
  out+=calendar(S.calMonth,dots,S.calDay)+`<div class="legend"><span><i class="d-blue"></i>Vous êtes affecté</span><span><i class="d-go"></i>Vos départs</span><span><i class="d-warn"></i>Contrôle 15 jours ou mensuel prévu</span></div></div>`;
  const k=S.calDay;const a=(S.planning[k]&&S.planning[k].assign)||{};
  out+=`<div class="sect"><h2 style="text-transform:capitalize">${esc(fD(k))}</h2><div class="card list">`;
  let rows='';
  Object.entries(a).forEach(([vid,uid])=>{const v=vById(vid);if(v&&uid===P.uid)rows+=`<div class="li"><span class="badge blue">${I('user-check')}</span><div class="grow"><div class="ttl">${esc(v.name)} vous est attribuée</div></div></div>`});
  S.insp.filter(i=>i.date===k&&i.uid===P.uid).slice().reverse().forEach(i=>rows+=`<div class="li"><span class="badge ${i.kind==='depart'?'blue':'go'}">${I(i.kind==='depart'?'play':'flag')}</span><div class="grow"><div class="ttl">${i.kind==='depart'?'Départ':'Retour'} ${esc(i.vehicleName)}</div><div class="small muted">${fT(i.createdAt)}${i.level?', '+LEVELS[i.level].t.toLowerCase():''}</div></div></div>`);
  S.vehicles.forEach(v=>{const d=dueInfo(v.id);if(d.n15===k)rows+=`<div class="li"><span class="badge warn">${I('calendar-range')}</span><div class="grow"><div class="ttl">${esc(v.name)} : contrôle 15 jours prévu</div></div></div>`;if(d.nm===k)rows+=`<div class="li"><span class="badge warn">${I('calendar-check')}</span><div class="grow"><div class="ttl">${esc(v.name)} : contrôle mensuel prévu</div></div></div>`});
  out+=(rows||`<div class="empty">Rien de prévu ce jour-là.</div>`)+`</div></div>`;
  out+=`<div class="sect"><h2>Prochains contrôles</h2><div class="card list">`+S.vehicles.map(v=>{const d=dueInfo(v.id);
    const t=(n,late,days,never)=>never?'jamais fait, à faire dès le prochain départ':late?`en retard depuis le ${fDs(n)}`:days===0?'aujourd’hui':`le ${fDs(n)}, dans ${days} jour${days>1?'s':''}`;
    return `<div class="li"><span class="badge ${d.late15||d.lateM?'stop':d.due15||d.dueM?'warn':'go'}">${I('ambulance')}</span><div class="grow"><div class="ttl">${esc(v.name)}</div><div class="small muted">15 jours : ${t(d.n15,d.late15,d.d15,!d.l15)}<br>Mensuel : ${t(d.nm,d.lateM,d.dM,!d.lm)}</div></div></div>`}).join('')+`</div></div>`;
  return out;
}

    let secs=[{id:'sani',title:'Matériel sanitaire',items:SANI_DAILY,mode:'ok'}];
    if(level!=='daily')secs=secs.concat(INV_15.map(s=>({...s,mode:'inv'})));
    if(level==='monthly')secs=secs.concat(INV_MONTH.map(s=>({...s,mode:'inv'})),[{id:'hyg',title:'Hygiène du véhicule',items:HYGIENE,mode:'ok'},{id:'docs',title:'Documents à bord',items:DOCS,mode:'inv'}]);

    st.push({id:'sani',type:'checks',title:level==='daily'?'Sanitaire et équipement':'Équipement et inventaire',ic:'heart-pulse',help:level==='daily'?'Vérifiez le matériel essentiel.':'Vérifiez que chaque élément est présent et en bon état. Déclarez les absences.',sections:secs});
    st.push({id:'disinf',type:'disinf',title:'Cahier de désinfection',ic:'spray-can',help:'Renseignez la désinfection faite avant ce départ.'});
  }else{
    st.push({id:'route',type:'checks',title:'Mécanique pendant la route',ic:'route',help:'Avez-vous remarqué une anomalie pendant la mission ?',sections:[{id:'route',title:'Pendant la route',items:RET_ROUTE,mode:'ok'}]});
    st.push({id:'rext',type:'checks',title:'Extérieur et cellule',ic:'shield-check',help:'Contrôlez l’état du véhicule au retour.',sections:[{id:'rext',title:'Extérieur',items:RET_EXT,mode:'ok'},{id:'rcell',title:'Cellule sanitaire',items:RET_CELL,mode:'ok'}]});

function startWizard(kind,vid,level){
  const v=vById(vid);if(!v)return;
  if(kind==='depart'&&inUse(v)&&vState(v).by!==P.uid)return toast(`${v.name} est en service avec ${vState(v).byName}.`,true);
  if(kind==='depart'&&inUse(v)&&vState(v).by===P.uid)return toast('Vous avez déjà cette ambulance : faites d’abord le retour.',true);
  if(kind==='retour'&&!(inUse(v)&&vState(v).by===P.uid)&&S.role!=='admin')return toast('Ce véhicule n’est pas en service avec vous.',true);
  const dep=kind==='retour'?S.insp.find(i=>i.id===vState(v).departId):null;
  S.wz={kind,vid,level:kind==='depart'?level:(dep&&dep.level)||'daily',step:0,steps:buildSteps(kind,level,vid),photos:{},km:'',fuel:'',checks:{},disinf:{zones:[]},comment:'',busy:0,dep};
  closeModal();S.route='wizard';render();window.scrollTo(0,0);
}
function vWizard(){
  const w=S.wz,v=vById(w.vid),st=w.steps[w.step];
  const prog=w.steps.map((s,i)=>`<span class="${i<w.step?'done':i===w.step?'cur':''}"></span>`).join('');
  let body='';
  if(st.type==='photos'){
    body+=`<div class="shots">`+PHOTOS.map(([k,l,req])=>{const ph=w.photos[k];
      return `<label class="shot ${ph?'ok':''}" id="sh-${k}"><input type="file" accept="image/*" capture="environment" data-photo="${k}">${ph?img(ph,l).replace('data-act="zoom"',''):I(k==='compteur'?'gauge':'camera')}<span class="${ph?'cap':''}">${esc(l)}</span>${req?`<span class="req">${ph?'Fait':'Obligatoire'}</span>`:''}</label>`}).join('')+`</div>`;
    if(w.dep&&w.dep.photos)body+=`<p class="small muted" style="margin-top:10px">${I('history')} Les photos du départ sont disponibles pour l’administrateur, qui les comparera avec celles-ci.</p>`;
    const lastKm=curKm(v);
    body+=`<div class="card" style="margin-top:16px"><div class="two"><div><label class="f" style="margin-top:0">Kilométrage au compteur</label><input class="in" type="number" inputmode="numeric" data-w="km" value="${esc(w.km)}" placeholder="Dernier relevé : ${nf(lastKm)}"></div>
    <div><label class="f" style="margin-top:0">Carburant</label><div class="chips" id="fuelChips">${FUEL.map(f=>`<button type="button" class="${w.fuel===f?'on':''}" data-act="fuel" data-v="${f}">${f}</button>`).join('')}</div></div></div></div>`;
  }else if(st.type==='checks'){
    st.sections.forEach(sec=>{
      body+=`<div class="checkgroup"><div class="gh"><h3>${esc(sec.title)}</h3><span class="counter" id="cnt-${sec.id}"></span><button class="btn go sm" data-act="allOk" data-s="${sec.id}">${I('check-check')}${sec.mode==='inv'?'Tout présent':'Tout OK'}</button></div>`;
      sec.items.forEach(([k,l])=>{const key=sec.id+'.'+k;
        body+=`<div class="ck" id="ck-${cssId(key)}"><div class="q"><div class="lab">${esc(l)}</div><div class="tog">`+
        (sec.mode==='inv'?`<button class="ok" data-act="setS" data-k="${key}" data-v="ok">Présent</button><button class="abs" data-act="setS" data-k="${key}" data-v="abs">Absent</button><button class="def" data-act="setS" data-k="${key}" data-v="def">Défect.</button>`
                         :`<button class="ok" data-act="setS" data-k="${key}" data-v="ok">OK</button><button class="pb" data-act="setS" data-k="${key}" data-v="pb">Problème</button>`)+
        `</div></div><div class="decl"><textarea class="in" data-com="${key}" placeholder="Décrivez le problème (obligatoire)" style="min-height:70px"></textarea><div class="row"><label class="addph">${I('camera')}Ajouter une photo<input type="file" accept="image/*" capture="environment" data-pph="${key}"></label><span id="pph-${cssId(key)}"></span></div></div></div>`;
      });
      body+=`</div>`;
    });
  }else if(st.type==='disinf'){
    body+=`<div class="card">${disinfForm('wz',w.disinf)}</div>`;
  }else{
    const pbs=problemList(w);const n=Object.values(w.checks).filter(c=>c.s==='ok').length;
    body+=`<div class="card"><div class="row"><span class="badge go">${I('check-check')}</span><div class="grow"><div class="ttl" style="font-weight:700">${n} point${n>1?'s':''} conforme${n>1?'s':''}</div><div class="small muted">${Object.keys(w.photos).length} photo${Object.keys(w.photos).length>1?'s':''}, ${nf(w.km)} km, carburant ${esc(w.fuel)}</div></div></div></div>`;
    body+=`<div class="card" style="margin-top:12px"><div class="row"><span class="badge ${pbs.length?'stop':'go'}">${I(pbs.length?'triangle-alert':'shield-check')}</span><div class="grow"><div style="font-weight:700">${pbs.length?pbs.length+' problème'+(pbs.length>1?'s':'')+' déclaré'+(pbs.length>1?'s':''):'Aucun problème déclaré'}</div>${pbs.length?'<div class="small muted">Ils seront envoyés à l’administrateur.</div>':''}</div></div>${pbs.length?`<div class="list" style="margin-top:8px">${pbs.map(p=>`<div class="li"><div class="grow"><div class="ttl">${esc(p.label)}</div><div class="small muted">${p.s==='abs'?'Absent':p.s==='def'?'Défectueux':'Problème'} : ${esc(p.c)}</div></div></div>`).join('')}</div>`:''}</div>`;
    if(w.kind==='depart')body+=`<div class="card" style="margin-top:12px"><div class="row"><span class="badge blue">${I('spray-can')}</span><div class="grow"><div style="font-weight:700">Désinfection</div><div class="small muted">${esc(w.disinf.type||'')}, ${esc(w.disinf.product||'')}</div></div></div></div>`;
    body+=`<div class="card" style="margin-top:12px"><label class="f" style="margin-top:0" for="wzCom">Commentaire général (obligatoire)</label><textarea class="in" id="wzCom" data-w="comment" placeholder="État général, informations pour l’équipe ou l’administrateur">${esc(w.comment)}</textarea></div>`;
  }
  const last=w.step===w.steps.length-1;
  return `<div class="wz" style="padding:calc(14px + var(--safe-t)) 16px 130px">
  <div class="wzhead"><button class="btn sec sm" data-act="wzBack" aria-label="Retour">${I('chevron-left')}</button><div class="grow"><div style="font-weight:800">${w.kind==='depart'?'Départ':'Retour'} ${esc(v.name)}</div><div class="small muted">${w.kind==='depart'?LEVELS[w.level].t:'Contrôle après utilisation'}, étape ${w.step+1} sur ${w.steps.length}</div></div>${plate(v.plate)}</div>
  <div class="prog">${prog}</div>
  <div class="steptitle"><span class="ico">${I(st.ic)}</span><h2>${esc(st.title)}</h2></div><p class="muted" style="margin-bottom:14px">${esc(st.help)}</p>
  ${body}</div>
  <div class="wzfoot"><div class="in2"><div class="hint" id="wzHint"></div><button class="btn ${last?'go':''}" id="wzNext" data-act="wzNext">${last?I('check')+(w.kind==='depart'?'Valider le départ':'Valider le retour'):'Suivant'+I('chevron-right')}</button></div></div>`;
}
const cssId = k => k.replace(/[^a-z0-9_-]/gi,'_');
function afterWizard(){
  const w=S.wz;Object.keys(w.checks).forEach(paintCk);wzHint();
  if(w.steps[w.step].type==='disinf'){const p=$('#wzProd');p&&p.addEventListener('change',()=>$('#wzProdO').classList.toggle('hide',p.value!=='Autre produit'))}
}
function paintCk(key){
  const c=S.wz.checks[key]||{};const el=document.getElementById('ck-'+cssId(key));if(!el)return;
  el.querySelectorAll('.tog button').forEach(b=>b.classList.toggle('on',b.dataset.v===c.s));
  el.classList.toggle('need',!!c.s&&c.s!=='ok');
  const t=el.querySelector('[data-com]');if(t&&c.c!=null&&t.value!==c.c)t.value=c.c;
  const ph=document.getElementById('pph-'+cssId(key));if(ph)ph.innerHTML=c.ph?img(c.ph,'Photo du problème'):'';
  hydrate();
}
function problemList(w){
  const out=[];w.steps.forEach(st=>(st.sections||[]).forEach(sec=>sec.items.forEach(([k,l])=>{const c=w.checks[sec.id+'.'+k];if(c&&c.s&&c.s!=='ok')out.push({key:sec.id+'.'+k,label:l,section:sec.title,s:c.s,c:c.c||'',ph:c.ph||null})})));
  return out;
}
function stepCheck(){
  const w=S.wz,st=w.steps[w.step];const miss=[];
  if(w.busy)miss.push('envoi des photos en cours');
  if(st.type==='photos'){const n=PHOTOS.filter(p=>p[2]&&!w.photos[p[0]]).length;if(n)miss.push(n+' photo'+(n>1?'s':'')+' obligatoire'+(n>1?'s':''));
    if(!w.km)miss.push('kilométrage');if(!w.fuel)miss.push('carburant');}
  if(st.type==='checks'){let n=0,c=0;st.sections.forEach(sec=>sec.items.forEach(([k])=>{const x=w.checks[sec.id+'.'+k];if(!x||!x.s)n++;else if(x.s!=='ok'&&!(x.c||'').trim())c++}));
    if(n)miss.push(n+' point'+(n>1?'s':'')+' à vérifier');if(c)miss.push(c+' problème'+(c>1?'s':'')+' à décrire');}
  if(st.type==='disinf'){const d=readDisinf('wz');if(!d.productSel)miss.push('produit');if(!d.type)miss.push('type');if(!d.zones.length)miss.push('zones traitées');}
  if(st.type==='confirm'&&!w.comment.trim())miss.push('commentaire général');
  return miss;
}
function wzHint(){
  const w=S.wz;const st=w.steps[w.step];
  if(st.type==='checks')st.sections.forEach(sec=>{let n=0,pb=0;sec.items.forEach(([k])=>{const x=w.checks[sec.id+'.'+k];if(x&&x.s){n++;if(x.s!=='ok')pb++}});const el=$('#cnt-'+sec.id);if(el){el.textContent=(pb?pb+' problème'+(pb>1?'s':'')+', ':'')+n+'/'+sec.items.length;el.className='counter'+(pb?' pb':n===sec.items.length?' full':'')}});
  const m=stepCheck();const h=$('#wzHint');if(h)h.textContent=m.length?'Reste : '+m.join(', '):'Tout est prêt';
}
function wzNext(){
  const w=S.wz,st=w.steps[w.step];
  if(st.type==='disinf')w.disinf=readDisinf('wz');
  const m=stepCheck();
  if(m.length){toast('À compléter : '+m.join(', '),true);
    if(st.type==='checks'){const first=[...document.querySelectorAll('.ck')].find(el=>{const k=el.querySelector('[data-com]').dataset.com;const c=w.checks[k];return !c||!c.s||(c.s!=='ok'&&!(c.c||'').trim())});first&&first.scrollIntoView({behavior:'smooth',block:'center'})}return}
  if(st.type==='photos'){const v=vById(w.vid);const km=Number(w.km);
    if(w.kind==='retour'&&w.dep&&w.dep.km&&km<w.dep.km)return toast(`Le kilométrage doit être au moins celui du départ (${nf(w.dep.km)} km).`,true);
    if(w.kind==='depart'&&km<curKm(v)-5)return toast(`Le kilométrage est inférieur au dernier relevé (${nf(curKm(v))} km). Vérifiez le compteur.`,true);}
  if(w.step<w.steps.length-1){w.step++;render();window.scrollTo(0,0);return}
  submitWizard();
}
function wzBack(){
  const w=S.wz;if(w.steps[w.step].type==='disinf')w.disinf=readDisinf('wz');
  if(w.step>0){w.step--;render();window.scrollTo(0,0);return}
  modal(`<div class="sh"><h2>Abandonner le contrôle ?</h2></div><p class="muted">Les informations saisies seront perdues et le véhicule ne sera pas marqué comme ${w.kind==='depart'?'parti':'revenu'}.</p>
  <div class="row" style="margin-top:18px"><button class="btn ghost grow" data-act="closeM">Continuer le contrôle</button><button class="btn stop grow" id="cxYes">Abandonner</button></div>`);
  $('#cxYes').onclick=()=>{layer.innerHTML='';S.wz=null;S.route=S.role==='admin'?'dash':'home';render()};
}
async function submitWizard(){
  const w=S.wz;const v=vById(w.vid);const btn=$('#wzNext');btn.disabled=true;btn.innerHTML='Enregistrement…';
  const now=Date.now(),today=dkey();const vRef=P.db.doc('vehicles/'+w.vid);const iRef=P.db.collection('inspections').doc();
  const pbs=problemList(w);
  const doc={kind:w.kind,level:w.level,vehicleId:w.vid,vehicleName:v.name,date:today,createdAt:now,uid:P.uid,employee:S.user.name,
    photos:w.photos,km:Number(w.km),fuel:w.fuel,checks:w.checks,comment:w.comment.trim(),problems:pbs.length};
  if(w.kind==='retour'){doc.departId=w.dep?w.dep.id:(vState(v).departId||null);doc.departAt=vState(v).since||null}
  if(w.kind==='depart')doc.disinf=w.disinf;
  try{
    await P.db.runTransaction(async t=>{
      const s=await t.get(vRef);const cur=(s.exists&&s.data().state)||{status:'free'};
      if(w.kind==='depart'&&cur.status==='in_use')throw {code:'busy',msg:`${v.name} vient de partir avec ${cur.byName}.`};
      if(w.kind==='retour'&&(cur.status!=='in_use'||(cur.by!==P.uid&&S.role!=='admin')))throw {code:'busy',msg:'Ce véhicule n’est plus en service avec vous.'};
      t.set(iRef,doc);
      const newKm=Math.max(Number(s.exists&&s.data().km)||0,Number(w.km));
      t.update(vRef,{km:newKm,state:w.kind==='depart'?{status:'in_use',by:P.uid,byName:S.user.name,since:now,departId:iRef.id,level:w.level}:{status:'free',lastBy:S.user.name,lastReturn:now}});
    });
    if(pbs.length){const bt=P.db.batch();pbs.forEach(p=>bt.set(P.db.collection('issues').doc(),{vehicleId:w.vid,vehicleName:v.name,inspId:iRef.id,kind:w.kind,label:p.label,section:p.section,type:p.s,comment:p.c,photo:p.ph,date:today,createdAt:now,uid:P.uid,employee:S.user.name,status:'open'}));await bt.commit().catch(e=>console.warn(e))}
    if(w.kind==='depart')await P.db.collection('disinfection').doc().set({date:today,createdAt:now,vehicleId:w.vid,vehicleName:v.name,product:w.disinf.product,type:w.disinf.type,zones:w.disinf.zones,obs:w.disinf.obs,uid:P.uid,intervenant:S.user.name,inspId:iRef.id}).catch(e=>console.warn(e));
    S.wz=null;S.route=S.role==='admin'?'dash':'home';render();window.scrollTo(0,0);
    toast(w.kind==='depart'?`Départ enregistré à ${fT(now)}. Bonne mission !`:`Retour enregistré à ${fT(now)}. ${v.name} est de nouveau disponible.`);
  }catch(e){console.warn(e);btn.disabled=false;btn.innerHTML=I('check')+(w.kind==='depart'?'Valider le départ':'Valider le retour');icons();toast(e.msg||errMsg(e),true)}
}

function vDash(){
  const today=dkey(),month=mkey();
  const dep=S.insp.filter(i=>i.kind==='depart'),ret=S.insp.filter(i=>i.kind==='retour');
  const dT=dep.filter(i=>i.date===today).length,dM=dep.filter(i=>i.date.startsWith(month)).length,rT=ret.filter(i=>i.date===today).length,rM=ret.filter(i=>i.date.startsWith(month)).length;
  const oi=openIssues();const A=alerts();const late=A.filter(a=>a.ic==='wrench'&&a.lvl==='stop').length;
  let out=`<div class="row wrap"><div class="grow"><h1>Tableau de bord</h1><p class="muted" style="margin-top:4px;text-transform:capitalize">${esc(fD(today))}</p></div></div>
  <div class="kpis" style="margin-top:16px">
    <div class="kpi"><div class="n">${dT}</div><div class="l">Départs aujourd’hui</div><div class="m">${dM} ce mois-ci</div></div>
    <div class="kpi"><div class="n">${rT}</div><div class="l">Retours aujourd’hui</div><div class="m">${rM} ce mois-ci</div></div>
    <div class="kpi ${oi.length?'stop':''}"><div class="n">${oi.length}</div><div class="l">Signalements ouverts</div><div class="m">${S.issues.filter(i=>i.date.startsWith(month)).length} ce mois-ci</div></div>
    <div class="kpi ${late?'stop':''}"><div class="n">${late}</div><div class="l">Entretiens en retard</div><div class="m">${A.filter(a=>a.ic==='wrench'&&a.lvl==='warn').length} à prévoir bientôt</div></div>
  </div>`;
  if(A.length)out+=`<div class="sect"><h2>Alertes</h2><div class="card list">${A.slice(0,12).map(a=>`<div class="li click" data-act="go" data-r="${a.go[0]}" data-p="${esc(a.go[1]||'')}"><span class="badge ${a.lvl}">${I(a.ic)}</span><div class="grow"><div class="ttl">${esc(a.t)}</div><div class="small muted">${esc(a.s)}</div></div>${I('chevron-right')}</div>`).join('')}${A.length>12?`<p class="small muted" style="padding-top:8px">Et ${A.length-12} autre${A.length-12>1?'s':''}.</p>`:''}</div></div>`;
  out+=`<div class="sect"><h2>La flotte aujourd’hui</h2>`;
  if(!S.vehicles.length)out+=`<div class="card empty">${I('ambulance')}<p>Aucun véhicule.</p><button class="btn" style="margin-top:12px" data-act="go" data-r="fleet" data-p="veh">${I('plus')}Ajouter une ambulance</button></div>`;
  else out+=`<div class="grid">${S.vehicles.map(v=>{const st=vState(v);const busy=inUse(v);const off=v.status==='maintenance';const dd=dep.filter(i=>i.vehicleId===v.id&&i.date===today);const pb=S.issues.filter(i=>i.vehicleId===v.id&&i.status!=='resolved').length;
    return `<article class="veh ${busy?'busy':''} ${off?'off':''}" style="cursor:pointer" data-act="go" data-r="vehicle" data-p="${v.id}"><div class="band"></div><div class="body">
    <div class="row">${plate(v.plate)}<span class="grow"></span>${off?'<span class="status off">Hors service</span>':busy?'<span class="status busy">En service</span>':'<span class="status go">Disponible</span>'}</div>
    <div><div class="name">${esc(v.name)}</div><div class="small muted">${busy?`Avec ${esc(st.byName)} depuis ${fT(st.since)}`:dd.length?`${dd.length} départ${dd.length>1?'s':''} aujourd’hui`:'Pas encore sorti aujourd’hui'}</div></div>
    <div class="tags">${dd.length?'<span class="tag go">Contrôle du jour fait</span>':'<span class="tag">Contrôle du jour non fait</span>'}${pb?`<span class="tag stop">${pb} signalement${pb>1?'s':''}</span>`:''}</div></div></article>`}).join('')}</div>`;
  out+=`</div><div class="sect"><div class="row"><h2 class="grow">Derniers signalements</h2></div><div class="card list">`+
    (S.issues.slice(0,15).map(issueRow).join('')||`<div class="empty">${I('shield-check')}<p>Aucun signalement.</p></div>`)+`</div></div>`;
  return out;
}
function issueRow(i){return `<div class="li click" data-act="issue" data-id="${i.id}"><span class="badge ${i.status==='resolved'?'go':'stop'}">${I(i.status==='resolved'?'check':'triangle-alert')}</span><div class="grow"><div class="ttl">${esc(i.vehicleName)} : ${esc(i.label)}</div><div class="small muted">${esc(i.comment)}<br>${fDs(i.date)} à ${fT(i.createdAt)}, ${esc(i.employee)}</div></div><span class="tag ${i.status==='resolved'?'go':'stop'}">${i.status==='resolved'?'Corrigé':'À traiter'}</span></div>`}
function sheetIssue(id){
  const i=S.issues.find(x=>x.id===id);if(!i)return;
  modal(`<div class="sh"><span class="badge ${i.status==='resolved'?'go':'stop'}">${I(i.status==='resolved'?'check':'triangle-alert')}</span><h2>${esc(i.label)}</h2><button class="iconbtn" style="background:var(--grey-2);color:var(--ink)" data-act="closeM" aria-label="Fermer">${I('x')}</button></div>

  <div class="li"><div class="grow small muted">Quand</div><b>${fDs(i.date)} à ${fT(i.createdAt)}</b></div><div class="li"><div class="grow small muted">Contrôle</div><b>${i.kind==='retour'?'Retour':'Départ'}, ${esc(i.section||'')}</b></div>
  <div class="li"><div class="grow small muted">Type</div><b>${i.type==='abs'?'Absent':i.type==='def'?'Défectueux':'Problème'}</b></div></div>
  <div class="card flat" style="margin-top:12px">${esc(i.comment)}</div>
  ${i.photo?`<div style="margin-top:12px" class="thumbs">${img(i.photo,i.label)}</div>`:''}
  ${i.status==='resolved'?`<div class="reminder info" style="margin-top:14px">${I('check')}<div>Corrigé le ${fDs(i.resolvedDate)} par ${esc(i.resolvedBy)}${i.resolution?` : ${esc(i.resolution)}`:''}</div></div><button class="btn ghost full" style="margin-top:12px" id="isReopen">Rouvrir le signalement</button>`
  :`<label class="f">Ce qui a été fait</label><textarea class="in" id="isRes" placeholder="Réparation, remplacement, intervention du garage…"></textarea><button class="btn go full" style="margin-top:12px" id="isDone">${I('check')}Marquer comme corrigé</button>`}`);
  hydrate();
  const d=$('#isDone');if(d)d.onclick=()=>safe(async()=>{await P.db.doc('issues/'+id).update({status:'resolved',resolution:$('#isRes').value.trim(),resolvedBy:S.user.name,resolvedDate:dkey(),resolvedAt:Date.now()});closeModal()},'Signalement corrigé');
  const r=$('#isReopen');if(r)r.onclick=()=>safe(async()=>{await P.db.doc('issues/'+id).update({status:'open'});closeModal()},'Signalement rouvert');
}

/* ---------------- Planning administrateur ---------------- */
function vAdminPlan(){
  const dots=k=>{const r=[];if(S.insp.some(i=>i.date===k&&i.kind==='depart'))r.push('blue');if(S.issues.some(i=>i.date===k))r.push('stop');
    if(S.disinf.some(d=>d.date===k))r.push('go');if(S.planning[k]&&Object.keys(S.planning[k].assign||{}).length)r.push('ink');
    if(k>=dkey()&&S.vehicles.some(v=>{const d=dueInfo(v.id);return d.n15===k||d.nm===k}))r.push('warn');return r};
  let out=`<h1>Planning</h1><p class="muted" style="margin:4px 0 16px">Touchez un jour pour voir tout ce qui s’est passé et attribuer les véhicules.</p>`;
  out+=calendar(S.calMonth,dots,S.calDay)+`<div class="legend"><span><i class="d-blue"></i>Départs</span><span><i class="d-stop"></i>Signalements</span><span><i class="d-go"></i>Désinfections</span><span><i class="d-ink"></i>Affectations</span><span><i class="d-warn"></i>Contrôle 15 jours ou mensuel prévu</span></div></div>`;
  const k=S.calDay;const deps=S.insp.filter(i=>i.date===k&&i.kind==='depart').slice().reverse();
  out+=`<div class="sect"><h2 style="text-transform:capitalize">${esc(fD(k))}</h2>`;
  // affectations
  const a=(S.planning[k]&&S.planning[k].assign)||{};const emps=S.users.filter(u=>!u.disabled);
  out+=`<div class="card"><h3>Affectations du jour</h3><p class="small muted" style="margin:4px 0 6px">L’employé verra le véhicule en tête de sa liste avec la mention « Attribuée à vous ».</p><div class="list">`+
    S.vehicles.map(v=>`<div class="li"><div class="grow"><div class="ttl">${esc(v.name)}</div></div><select class="in" style="max-width:220px;min-height:42px" data-assign="${v.id}" data-day="${k}"><option value="">Personne</option>${emps.map(u=>`<option value="${u.id}" ${a[v.id]===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div>`).join('')+`</div></div>`;
  // utilisations
  out+=`<div class="card" style="margin-top:14px"><h3>Utilisations des véhicules</h3>`;
  if(!deps.length)out+=`<div class="empty">Aucun départ ce jour-là.</div>`;

  const notOut=k<=dkey()?S.vehicles.filter(v=>!deps.some(d=>d.vehicleId===v.id)):[];
  if(notOut.length)out+=`<p class="small muted" style="margin-top:10px">Sans départ ce jour-là : ${notOut.map(v=>esc(v.name)).join(', ')}.</p>`;
  out+=`</div>`;
  const iss=S.issues.filter(i=>i.date===k);
  out+=`<div class="card" style="margin-top:14px"><h3>Signalements</h3><div class="list">${iss.map(issueRow).join('')||'<div class="empty">Aucun signalement ce jour-là.</div>'}</div></div>`;
  const dis=S.disinf.filter(x=>x.date===k);
  out+=`<div class="card" style="margin-top:14px"><h3>Désinfections</h3><div class="list">${dis.map(x=>`<div class="li"><span class="badge go">${I('spray-can')}</span><div class="grow"><div class="ttl">${esc(x.vehicleName)} : ${esc(x.type)}</div><div class="small muted">${esc(x.product)}, ${esc((x.zones||[]).join(', '))}<br>${fT(x.createdAt)}, ${esc(x.intervenant)}</div></div><span class="tag go">Validé</span></div>`).join('')||'<div class="empty">Aucune désinfection ce jour-là.</div>'}</div></div></div>`;
  return out;
}
function usageBlock(d,open){
  const r=retourOf(d.id);const pb=(d.problems||0)+(r?r.problems||0:0);
  let h=`<div class="li click" data-act="toggleUse" data-id="${d.id}" style="border-bottom:1px solid #EEF1F5"><span class="badge ${pb?'stop':'blue'}">${I('ambulance')}</span><div class="grow"><div class="ttl">${esc(d.vehicleName)}, ${esc(d.employee)}</div>
  <div class="small muted">Départ ${fT(d.createdAt)} (${LEVELS[d.level]?LEVELS[d.level].t.toLowerCase():'contrôle'}), ${r?`retour ${fT(r.createdAt)}${r.date!==d.date?' le '+fDs(r.date):''}, ${nf(r.km-d.km)} km`:'<b style="color:var(--warn)">retour pas encore fait</b>'}${pb?`, ${pb} problème${pb>1?'s':''}`:''}</div></div>${I(open?'chevron-up':'chevron-down')}</div>`;
  if(open)h+=compareBlock(d,r);
  return h;
}
function compareBlock(d,r){
  let h=`<div style="padding:10px 0 16px"><div class="cmp"><div></div><div class="small" style="font-weight:700">Départ ${fT(d.createdAt)}</div><div class="small" style="font-weight:700">Retour ${r?fT(r.createdAt):''}</div></div>`;
  PHOTOS.forEach(([k,l])=>h+=`<div class="cmp"><div class="small" style="font-weight:600">${esc(l)}</div>${img(d.photos&&d.photos[k],'Départ, '+l)}${r?img(r.photos&&r.photos[k],'Retour, '+l):'<div class="none">Pas encore</div>'}</div>`);
  h+=`<p class="small" style="margin-top:10px">Kilométrage : ${nf(d.km)}${r?' puis '+nf(r.km):''}. Carburant : ${esc(d.fuel||'—')}${r?' puis '+esc(r.fuel||'—'):''}.</p>`;
  [d,r].filter(Boolean).forEach(x=>{const pbs=Object.entries(x.checks||{}).filter(([k,c])=>c.s&&c.s!=='ok');
    h+=`<div class="card flat" style="margin-top:10px"><b>${x.kind==='depart'?'Départ':'Retour'}</b> par ${esc(x.employee)} : ${pbs.length?`${pbs.length} problème${pbs.length>1?'s':''}`:'tout est conforme'}
    ${pbs.map(([k,c])=>`<div class="small" style="margin-top:6px;color:#8A1820">${c.s==='abs'?'Absent':c.s==='def'?'Défectueux':'Problème'} : ${esc(labelOf(k))}. ${esc(c.c||'')}</div>`).join('')}
    ${x.comment?`<div class="small muted" style="margin-top:8px">Commentaire : ${esc(x.comment)}</div>`:''}</div>`});
  return h+`</div>`;
}
function labelOf(key){
  const [sid,k]=key.split('.');const all=[['meca',MECA_DAILY.concat(MECA_EXTRA)],['sani',SANI_DAILY],['hyg',HYGIENE],['docs',DOCS],['route',RET_ROUTE],['rext',RET_EXT],['rcell',RET_CELL],...INV_15.concat(INV_MONTH).map(s=>[s.id,s.items])];
  const f=all.find(a=>a[0]===sid);const it=f&&f[1].find(x=>x[0]===k);if(it)return it[1];
  if(sid==='eq'){const e=S.equip.find(e=>'eq_'+e.id===k);if(e)return e.name}return key;
}

/* ---------------- Maintenance ---------------- */
function vMaint(){
  let out=`<h1>Maintenance</h1><p class="muted" style="margin:4px 0 16px">Rappels d’entretien selon le kilométrage et la date de la dernière intervention.</p>`;
  if(!S.vehicles.length)return out+`<div class="card empty">Ajoutez d’abord des véhicules.</div>`;
  const all=[];S.vehicles.forEach(v=>maintItems(v.id).forEach(x=>all.push({v,x})));
  const urgent=all.filter(a=>a.x.st==='stop'||a.x.st==='warn').sort((a,b)=>(a.x.st==='stop'?0:1)-(b.x.st==='stop'?0:1));
  out+=`<div class="card"><h3>À prévoir</h3><div class="list">${urgent.map(({v,x})=>`<div class="li"><span class="badge ${x.st}">${I('wrench')}</span><div class="grow"><div class="ttl">${esc(v.name)} : ${esc(x.lbl)}</div><div class="small muted">${x.st==='stop'?'En retard':'Bientôt'}${x.nextKm!=null?`, prévu à ${nf(x.nextKm)} km (actuel ${nf(x.km)})`:''}${x.nextDate?`, le ${fDs(x.nextDate)}`:''}</div></div><button class="btn go sm" data-act="maintDone" data-v="${v.id}" data-k="${x.k}">Fait</button></div>`).join('')||'<div class="empty">Aucun entretien en retard ou proche.</div>'}</div></div>`;
  const dots=k=>{const r=[];all.forEach(({x})=>{if(x.nextDate===k)r.push(x.st==='stop'?'stop':'warn')});return r};
  out+=`<div class="sect"><h2>Calendrier des rappels</h2>`+calendar(S.calMonth,dots,S.calDay)+`<div class="legend"><span><i class="d-warn"></i>Entretien prévu</span><span><i class="d-stop"></i>Entretien en retard</span></div></div>`;
  const dayItems=all.filter(a=>a.x.nextDate===S.calDay);
  if(dayItems.length)out+=`<div class="card" style="margin-top:12px"><h3 style="text-transform:capitalize">${esc(fD(S.calDay))}</h3><div class="list">${dayItems.map(({v,x})=>`<div class="li"><span class="badge ${x.st}">${I('wrench')}</span><div class="grow ttl">${esc(v.name)} : ${esc(x.lbl)}</div></div>`).join('')}</div></div>`;
  out+=`</div>`;
  S.vehicles.forEach(v=>out+=`<div class="sect"><div class="row">${plate(v.plate)}<h2 class="grow">${esc(v.name)}</h2></div>${maintTable(v.id)}</div>`);
  return out;
}
function maintTable(vid){

    const st={ok:['go','À jour'],warn:['warn','Bientôt'],stop:['stop','En retard'],none:['','À renseigner']}[x.st];

    <td class="small">${x.last.lastDate?fDs(x.last.lastDate):'—'}${x.last.lastKm!=null?'<br>'+nf(x.last.lastKm)+' km':''}${x.last.note?`<div class="muted">${esc(x.last.note)}</div>`:''}</td><td class="small">${nx}</td>
    <td style="white-space:nowrap"><button class="btn go sm" data-act="maintDone" data-v="${vid}" data-k="${x.k}">Fait</button> <button class="btn ghost sm" data-act="maintInt" data-v="${vid}" data-k="${x.k}" aria-label="Modifier l’intervalle">${I('settings-2')}</button></td></tr>`}).join('')}</tbody></table></div></div>`;

let tt;function toast(m,err){clearTimeout(tt);let t=document.querySelector('.toast');if(!t){t=document.createElement('div');document.body.appendChild(t)}t.className='toast'+(err?' err':'');t.setAttribute('role','status');t.textContent=m;tt=setTimeout(()=>t.remove(),err?5000:3500)}
function errMsg(e){
  const F={'permission-denied':'Action non autorisée pour votre compte.','unavailable':'Pas de connexion internet.','auth/email-already-in-use':'Un compte existe déjà avec cet e-mail : connectez-vous.','auth/invalid-email':'Adresse e-mail invalide.','auth/weak-password':'Mot de passe trop court : 6 caractères minimum.','auth/invalid-credential':'E-mail ou mot de passe incorrect.','auth/wrong-password':'E-mail ou mot de passe incorrect.','auth/user-not-found':'Aucun compte avec cet e-mail : créez votre compte.','auth/too-many-requests':'Trop d’essais. Réessayez dans quelques minutes.','auth/network-request-failed':'Pas de connexion internet.','auth/missing-email':'Écrivez votre e-mail.'};

}

/* ---------- Documents (découpés en morceaux dans Firestore) ---------- */
const CHUNK=700000;
function fileToB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(file)})}
async function uploadFile(vid,file){
  if(file.size>8*1024*1024)return toast('Fichier trop lourd : 8 Mo maximum.',true);
  toast('Envoi du document…');
  const b64=await fileToB64(file);const n=Math.ceil(b64.length/CHUNK);const ref=P.db.collection('files').doc();
  await safe(async()=>{
    for(let i=0;i<n;i++)await ref.collection('chunks').doc(String(i)).set({d:b64.slice(i*CHUNK,(i+1)*CHUNK)});
    await ref.set({vehicleId:vid,name:file.name,size:file.size,type:file.type||'application/pdf',chunks:n,uploadedAt:Date.now(),by:S.user.name});
  },'Document ajouté');
}
async function openFile(id){
  const f=S.files.find(x=>x.id===id);if(!f)return;toast('Ouverture…');
  try{let b64='';for(let i=0;i<f.chunks;i++){const s=await P.db.doc(`files/${id}/chunks/${i}`).get();b64+=s.data().d}
    const bin=atob(b64);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([arr],{type:f.type}));const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';
    if(!/^image|pdf/.test(f.type))a.download=f.name;document.body.appendChild(a);a.click();a.remove();
  }catch(e){toast(errMsg(e),true)}
}

/* ---------- Actions ---------- */
const ACT={
  nav(t){go(t.dataset.r)},
  go(t){go(t.dataset.r,t.dataset.p)},
  logout(){P.auth&&P.auth.signOut()},
  authTab(t){S.authTab=t.dataset.t;pickedRole='employee';render()},
  pickRole(t){if(t.disabled)return;pickedRole=t.dataset.v;document.querySelectorAll('#roleSeg button').forEach(b=>b.classList.toggle('on',b===t))},
  forgot(){const em=($('#lgE')||{}).value;if(!em)return toast('Écrivez d’abord votre e-mail.',true);safe(()=>P.auth.sendPasswordResetEmail(em.trim()),'E-mail envoyé : suivez le lien pour choisir un nouveau mot de passe.')},
  chooseDep(t){sheetChooseDep(t.dataset.id)},
  startDep(t){startWizard('depart',t.dataset.id,t.dataset.l)},
  startRet(t){startWizard('retour',t.dataset.id)},
  wzNext(){wzNext()},wzBack(){wzBack()},
  fuel(t){S.wz.fuel=t.dataset.v;document.querySelectorAll('#fuelChips button').forEach(b=>b.classList.toggle('on',b===t));wzHint()},
  setS(t){const k=t.dataset.k;const c=S.wz.checks[k]||{};c.s=t.dataset.v;S.wz.checks[k]=c;paintCk(k);wzHint();if(c.s!=='ok'){const x=document.querySelector(`[data-com="${k}"]`);x&&x.focus()}},
  allOk(t){const st=S.wz.steps[S.wz.step];const sec=st.sections.find(s=>s.id===t.dataset.s);sec.items.forEach(([k])=>{const key=sec.id+'.'+k;const c=S.wz.checks[key];if(!c||!c.s){S.wz.checks[key]={s:'ok'};paintCk(key)}});wzHint()},
  zone(t){t.classList.toggle('on');if(S.route==='wizard')wzHint()},
  segPick(t){t.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t))},
  zoom(t){if(!t.src)return;layer.innerHTML=`<div class="lb" data-act="closeLb"><img src="${t.src}" alt=""><p>${esc(t.dataset.cap||'')}</p></div>`},
  closeLb(){layer.innerHTML=''},
  closeBg(t,e){if(e.target===t){layer.innerHTML='';if(S.route!=='wizard')render()}},
  closeM(){closeModal()},
  calNav(t){const [y,m]=S.calMonth.split('-').map(Number);const d=new Date(y,m-1+Number(t.dataset.n),1);S.calMonth=mkey(d);render()},
  calToday(){S.calMonth=mkey();S.calDay=dkey();render()},
  calDay(t){S.calDay=t.dataset.d;render()},
  toggleUse(t){S.params.openUse=S.params.openUse===t.dataset.id?null:t.dataset.id;render()},
  issue(t){sheetIssue(t.dataset.id)},
  newDisinf(){sheetNewDisinf()},
  sub(t){S.sub=t.dataset.t;render()},
  vt(t){S.params.vt=t.dataset.t;render()},
  hfClear(){S.params.hf='';render()},
  print(){window.print()},
  editV(t){sheetEditV(t.dataset.id)},
  editE(t){sheetEditE(t.dataset.id)},
  forceFree(t){const v=vById(t.dataset.id);confirmBox(`Libérer <b>${esc(v.name)}</b> sans contrôle de retour ? Le véhicule redeviendra disponible pour tous.`,()=>safe(()=>P.db.doc('vehicles/'+v.id).update({state:{status:'free',lastBy:S.user.name+' (libéré par l’administrateur)',lastReturn:Date.now()}}),'Véhicule libéré'),'Libérer')},
  addStaff(){const n=$('#stN').value.trim(),em=$('#stE').value.trim().toLowerCase(),f=$('#stF').value.trim(),r=$('#stR').value;
    if(!n||!em||!em.includes('@'))return toast('Nom et e-mail valides obligatoires.',true);
    safe(async()=>{await P.db.doc('staff/'+em).set({name:n,email:em,function:f,role:r,createdAt:Date.now()});const u=S.users.find(x=>(x.email||'')===em);if(u&&r!=='admin')await P.db.doc('users/'+u.id).update({name:n,function:f});render()},'Employé enregistré')},
  delStaff(t){confirmBox(`Retirer <b>${esc(t.dataset.id)}</b> de la liste ?`,()=>safe(()=>P.db.doc('staff/'+t.dataset.id).delete(),'Retiré'))},
  toggleU(t){const u=S.users.find(x=>x.id===t.dataset.id);safe(()=>P.db.doc('users/'+u.id).update({disabled:!u.disabled}),u.disabled?'Compte réactivé':'Compte désactivé')},
  openFile(t){openFile(t.dataset.id)},
  delFile(t){const f=S.files.find(x=>x.id===t.dataset.id);confirmBox(`Supprimer <b>${esc(f.name)}</b> ?`,()=>safe(async()=>{for(let i=0;i<f.chunks;i++)await P.db.doc(`files/${f.id}/chunks/${i}`).delete();await P.db.doc('files/'+f.id).delete()},'Document supprimé'))},
  maintDone(t){const vid=t.dataset.v,k=t.dataset.k;const v=vById(vid);const lbl=MAINT.find(m=>m[0]===k)[1];
    modal(`<div class="sh"><h2>${esc(lbl)}</h2><button class="iconbtn" style="background:var(--grey-2);color:var(--ink)" data-act="closeM" aria-label="Fermer">${I('x')}</button></div><p class="muted">${esc(v.name)}</p>
    <div class="two"><div><label class="f">Date de l’intervention</label><input class="in" type="date" id="mdD" value="${dkey()}"></div><div><label class="f">Kilométrage</label><input class="in" type="number" id="mdK" value="${curKm(v)}"></div></div>
    <label class="f">Note : garage, pièces, coût</label><input class="in" id="mdN"><button class="btn go full" style="margin-top:16px" id="mdSave">${I('check')}Enregistrer l’intervention</button>`);
    $('#mdSave').onclick=()=>{const cur=(S.maint[vid]&&S.maint[vid].items&&S.maint[vid].items[k])||{};saveMaint(vid,k,{...cur,lastDate:$('#mdD').value,lastKm:Number($('#mdK').value)||0,note:$('#mdN').value.trim()})}},
  maintInt(t){const vid=t.dataset.v,k=t.dataset.k;const x=maintItems(vid).find(i=>i.k===k);
    modal(`<div class="sh"><h2>Intervalle : ${esc(x.lbl)}</h2><button class="iconbtn" style="background:var(--grey-2);color:var(--ink)" data-act="closeM" aria-label="Fermer">${I('x')}</button></div><div class="two"><div><label class="f">Tous les (km)</label><input class="in" type="number" id="miK" value="${x.intKm||''}" placeholder="Aucun"></div><div><label class="f">Tous les (jours)</label><input class="in" type="number" id="miD" value="${x.intD||''}" placeholder="Aucun"></div></div><button class="btn full" style="margin-top:16px" id="miSave">Enregistrer</button>`);
    $('#miSave').onclick=()=>{const cur=(S.maint[vid]&&S.maint[vid].items&&S.maint[vid].items[k])||{};saveMaint(vid,k,{...cur,intKm:Number($('#miK').value)||null,intDays:Number($('#miD').value)||null})}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=ACT[t.dataset.act];if(a)a(t,e)});
document.addEventListener('submit',e=>{e.preventDefault();
  if(e.target.id==='fLogin'){const em=$('#lgE').value.trim(),pw=$('#lgP').value;safe(()=>P.auth.signInWithEmailAndPassword(em,pw))}
  if(e.target.id==='fSignup')doSignup();
});
document.addEventListener('input',e=>{const t=e.target;
  if(S.route==='wizard'){
    if(t.dataset.w){S.wz[t.dataset.w]=t.value;wzHint()}
    if(t.dataset.com){const k=t.dataset.com;const c=S.wz.checks[k]||{};c.c=t.value;S.wz.checks[k]=c;wzHint()}
  }
});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.id==='ndProd'){$('#ndProdO').classList.toggle('hide',t.value!=='Autre produit')}
  if(t.dataset.f){S.params.df[t.dataset.f]=t.value;render();return}
  if(t.hasAttribute('data-hf')){S.params.hf=t.value;render();return}
  if(t.dataset.assign){const day=t.dataset.day,vid=t.dataset.assign;const cur=(S.planning[day]&&S.planning[day].assign)||{};const a={...cur};if(t.value)a[vid]=t.value;else delete a[vid];
    safe(()=>P.db.doc('planning/'+day).set({assign:a}),'Affectation enregistrée');return}
  if(t.dataset.file){const f=t.files&&t.files[0];if(f)await uploadFile(t.dataset.file,f);t.value='';return}
  if(S.route!=='wizard')return;
  const w=S.wz,v=vById(w.vid);
  if(t.dataset.photo){const f=t.files&&t.files[0];if(!f)return;const k=t.dataset.photo;const lbl=PHOTOS.find(p=>p[0]===k)[1];const box=$('#sh-'+k);box&&box.classList.add('busy');w.busy++;wzHint();
    try{const id=await savePhoto(f,`${v.name}, ${w.kind==='depart'?'départ':'retour'}, ${lbl}`);if(S.wz!==w)return;w.photos[k]=id;
      if(box){box.classList.add('ok');box.innerHTML=`<input type="file" accept="image/*" capture="environment" data-photo="${k}">${img(id,lbl).replace('data-act="zoom"','')}<span class="cap">${esc(lbl)}</span>${PHOTOS.find(p=>p[0]===k)[2]?'<span class="req">Fait</span>':''}`}}
    catch(err){toast('Photo non enregistrée. '+errMsg(err),true)}finally{w.busy--;box&&box.classList.remove('busy');wzHint()}return}
  if(t.dataset.pph){const f=t.files&&t.files[0];if(!f)return;const k=t.dataset.pph;w.busy++;wzHint();toast('Envoi de la photo…');
    try{const id=await savePhoto(f,`${v.name}, problème`);const c=w.checks[k]||{};c.ph=id;w.checks[k]=c;paintCk(k);toast('Photo ajoutée')}catch(err){toast(errMsg(err),true)}finally{w.busy--;wzHint()}}
});
window.addEventListener('online',()=>soft());window.addEventListener('offline',()=>soft());
init();
