<style>
:root{--navy:#0f2747;--navy2:#1b3a66;--red:#d62839;--green:#1f9d55;--amber:#d98e04;--bg:#f2f4f8;--card:#fff;--line:#e3e7ee;--muted:#6b7587;--txt:#152033;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.hrow{display:flex;align-items:center;gap:8px;min-width:0;max-width:960px;margin:0 auto}
.logo{font-weight:800;font-size:18px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.logo span{background:var(--red);border-radius:8px;padding:2px 7px;font-size:15px}
.today{font-size:13px;opacity:.85;text-transform:capitalize}
.sp{flex:1}
.role{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.role b{font-weight:700}
nav.tabs{display:flex;gap:6px;max-width:960px;margin:10px auto 0;overflow-x:auto}
nav.tabs button{background:transparent;border:0;color:#c9d6ea;padding:7px 12px;border-radius:9px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:14px}
nav.tabs button.on{background:#fff;color:var(--navy)}
main{max-width:960px;margin:0 auto;padding:14px 14px 90px}
h2{font-size:19px;margin:6px 0 12px}
h3{font-size:16px;margin:18px 0 8px}
.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.veh{cursor:default}
.vtop{display:flex;align-items:center;gap:10px}
.vic{width:42px;height:42px;border-radius:11px;background:#eaf0fa;display:grid;place-items:center;font-size:22px;flex:none}
.vname{font-weight:700;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:#eef1f6;color:#3b475c;font-weight:600;white-space:nowrap}
.chip.ok{background:#e3f5ea;color:#17703d}.chip.bad{background:#fde6e8;color:#a5162a}.chip.warn{background:#fff2d6;color:#8a5a00}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{border:0;border-radius:11px;padding:11px 10px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.sec{background:#e9eef6;color:var(--navy)}
.btn.red{background:var(--red)}.btn.green{background:var(--green)}.btn.amber{background:var(--amber)}
.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line)}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:9px}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn .bsub{display:block;font-weight:500;font-size:11px;opacity:.85}
.btn.stack{flex-direction:column;gap:2px;padding:10px 6px}
.done{outline:3px solid #7fd3a0;outline-offset:-3px}
.back{background:none;border:0;color:var(--navy);font-weight:700;padding:4px 0;cursor:pointer;font-size:15px}
.fhead{background:var(--navy2);color:#fff;border-radius:var(--r);padding:14px;margin-bottom:12px}
.fhead .t{font-size:18px;font-weight:800}
.sec{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.sech{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;user-select:none}
.sech .ti{font-weight:700;flex:1}
.sech .arr{transition:transform .2s;color:var(--muted)}
.sec.closed .arr{transform:rotate(-90deg)}
.sec.closed .secb{display:none}
.prog{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:#eef1f6;color:#3b475c}
.prog.full{background:#e3f5ea;color:#17703d}.prog.haspb{background:#fde6e8;color:#a5162a}
.secb{border-top:1px solid var(--line);padding:4px 14px 12px}
.item{padding:10px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.irow{display:flex;align-items:center;gap:10px}
.ilab{flex:1;font-size:14px}
.seg{display:flex;gap:5px;flex:none}
.seg button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:13px;font-weight:700;cursor:pointer;color:#4a5568;min-width:44px}
.seg button.on.ok{background:var(--green);border-color:var(--green);color:#fff}
.seg button.on.pb{background:var(--red);border-color:var(--red);color:#fff}
.seg button.on.def{background:var(--amber);border-color:var(--amber);color:#fff}
.icom{margin-top:8px;display:none}
.item.need .icom{display:block}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid #cfd6e2;border-radius:10px;padding:10px 11px;background:#fff}
textarea{min-height:80px;resize:vertical}
label.f{display:block;font-size:13px;font-weight:600;color:#3b475c;margin:10px 0 5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.slot{position:relative;aspect-ratio:4/3;border:2px dashed #b8c3d6;border-radius:12px;background:#f7f9fc;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;text-align:center;color:#4a5568;font-weight:700;font-size:13px}
.slot.req::after{content:"obligatoire";position:absolute;top:6px;right:6px;font-size:10px;background:var(--red);color:#fff;border-radius:6px;padding:1px 5px;font-weight:700}
.slot.has{border-style:solid;border-color:var(--green)}
.slot.has::after{content:"✓";background:var(--green);font-size:12px;padding:1px 6px}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .cam{font-size:26px;margin-bottom:4px}
.slot .lbl{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;padding:14px 6px 5px;font-size:12px;z-index:2}
.slot.busy::before{content:"Envoi…";position:absolute;inset:0;background:rgba(255,255,255,.8);display:grid;place-items:center;z-index:3;font-weight:800;color:var(--navy)}
.slot input{display:none}
.ref{font-size:11px;color:var(--muted);margin-top:4px;display:flex;gap:6px;align-items:center}
.ref img{width:46px;height:34px;object-fit:cover;border-radius:5px;cursor:pointer}
.xrm{position:absolute;top:5px;left:5px;z-index:4;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:7px;width:26px;height:26px;cursor:pointer;font-size:14px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs img,.ph{width:96px;height:72px;object-fit:cover;border-radius:9px;cursor:pointer;background:#e9edf3;border:1px solid var(--line)}
.cmp{display:grid;grid-template-columns:90px 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
.cmp img,.cmp .none{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;cursor:pointer;background:#eef1f6;border:1px solid var(--line)}
.cmp .none{display:grid;place-items:center;font-size:12px;color:var(--muted)}
.cmph{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.pbl{list-style:none;padding:0;margin:6px 0}
.pbl li{padding:7px 10px;border-radius:9px;background:#fff4f5;border:1px solid #f6c9cf;margin-bottom:6px;font-size:14px}
.pbl li.def{background:#fff8e8;border-color:#f3d79a}
.pbl li small{display:block;color:#7a2330;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.tw{overflow-x:auto}
.banner{border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.banner.warn{background:#fff2d6;color:#6b4600;border:1px solid #f1d28c}
.banner.info{background:#e8f0fd;color:#1b3a66;border:1px solid #c5d6f5}
.banner.bad{background:#fde6e8;color:#8b1424;border:1px solid #f5bcc4}
.sticky{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:15}
.sticky .in{max-width:960px;margin:0 auto;display:flex;gap:10px;align-items:center}
.modal{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:#fff;border-radius:16px;padding:18px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
.mbox h3{margin-top:0}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:12px}
.lb img{max-width:100%;max-height:85vh;border-radius:8px}
.lb .cap{color:#fff;margin-top:10px;font-size:14px;text-align:center}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#152033;color:#fff;padding:11px 16px;border-radius:12px;z-index:70;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.toast.err{background:var(--red)}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi b{display:block;font-size:24px}
.kpi span{font-size:12px;color:var(--muted)}
.list a,.lrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.lrow:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:#c5cdd9}
.dot.ok{background:var(--green)}.dot.bad{background:var(--red)}.dot.warn{background:var(--amber)}
.insp{border-left:4px solid var(--navy2)}
.insp.t-retour{border-left-color:var(--green)}.insp.t-quinzaine{border-left-color:var(--amber)}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.login{max-width:380px;margin:30px auto}
.login .logo{color:var(--navy);font-size:24px;justify-content:center;margin-bottom:6px}
.hbtn{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:6px 10px;font-size:13px;cursor:pointer}
@media print{header,nav,.btn,.back,.sticky,.banner,.noprint{display:none!important}body,main{background:#fff}.card{break-inside:avoid;border-color:#ccc}}
@media (max-width:600px){.kpis{grid-template-columns:repeat(2,1fr)}.cmp{grid-template-columns:64px 1fr 1fr}.seg button{padding:7px 8px;min-width:40px}}
</style>
</head>

<script>window.FIREBASE_CONFIG = {apiKey:"AIzaSyA0tbZxvslberY0UiolsVwo2CzRKlleyFU",authDomain:"ambucheck-6df57.firebaseapp.com",projectId:"ambucheck-6df57",storageBucket:"ambucheck-6df57.firebasestorage.app",messagingSenderId:"34388929743",appId:"1:34388929743:web:fcf74a8e292a7cce7cdbba"};</script>
<script>
/* ================= CONFIGURATION DES CONTRÔLES ================= */
const DAILY = [

    ['freins','Freins et frein à main'],['direction','Direction'],['pneus','Pneus (usure, pression, crevaison)'],

    ['mhc','Masques haute concentration adulte'],['mhce','Masques haute concentration enfant'],['lun','Lunettes à oxygène']]},
  {id:'qrea', icon:'❤️', title:'Ventilation & réanimation', items:[

    ['dsa','DSA + électrodes de rechange (adulte / enfant)'],['aspi','Aspirateur + sondes d’aspiration']]},
  {id:'qdiag', icon:'🩺', title:'Matériel de diagnostic', items:[

  {id:'qimmo', icon:'🦴', title:'Immobilisation & brancardage', items:[
    ['collier','Colliers cervicaux (toutes tailles)'],['attelles','Attelles'],['coquille','Matelas coquille + pompe'],

  {id:'qsoin', icon:'🩹', title:'Soins & hygiène', items:[
    ['pans','Pansements, compresses, bandes'],['brul','Kit brûlés'],['accouch','Kit accouchement'],['survie','Couvertures de survie'],
    ['gants','Gants (toutes tailles)'],['masques','Masques chirurgicaux / FFP2'],['sha','Solution hydroalcoolique'],
    ['dasri','Sacs DASRI + collecteur à aiguilles'],['peremp','Dates de péremption vérifiées']]},
  {id:'qsecu', icon:'🧯', title:'Sécurité du véhicule', items:[
    ['ext','Extincteur (date de validité)'],['triangle','Triangle de signalisation'],['gilets','Gilets haute visibilité'],
    ['lampe','Lampe torche'],['papiers','Papiers du véhicule / assurance']]}
];
const ANGLES = [['avant','Avant',true],['arriere','Arrière',true],['gauche','Côté gauche',true],['droit','Côté droit',true],['interieur','Cellule intérieure',false]];
const FUEL = ['Plein','3/4','1/2','1/4','Réserve'];
const MAINT = [
  ['vidange','Vidange huile moteur + filtre',15000,365],
  ['filtres','Filtres (air, habitacle, gasoil)',30000,730],
  ['freins','Plaquettes et disques de frein',30000,null],
  ['pneus','Pneus (permutation / remplacement)',40000,null],
  ['boite','Boîte de vitesses (huile, contrôle)',60000,730],
  ['moteur','Contrôle moteur / diagnostic électronique',null,365],
  ['distribution','Courroie / kit de distribution',120000,1825],
  ['refroid','Liquide de refroidissement',null,730],
  ['batterie','Batterie',null,365],
  ['clim','Climatisation',null,365],
  ['revision','Révision générale constructeur',30000,365],
  ['ct','Contrôle technique',null,365]
];
const TYPES = {depart:{lbl:'Départ',full:'Avant utilisation – Départ',icon:'🚦',sections:DAILY,photos:true,km:true},

/* ================= UTILITAIRES ================= */
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const dkey = (d=new Date()) => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fmtD = k => { if(!k) return '—'; const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short',year:'numeric'}); };
const fmtT = ts => new Date(ts).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
const daysBetween = (a,b) => Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const addDays = (k,n) => { const d=new Date(k+'T12:00'); d.setDate(d.getDate()+n); return dkey(d); };
const nf = n => (n==null||n==='')?'—':Number(n).toLocaleString('fr-FR');
const rid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

const P = {db:null,st:null,auth:null,uid:null,canWrite:true,unsubs:[]};
const S = {setupDone:null,settingUp:false,vehicles:[],employees:[],inspections:[],maint:{},loaded:{},isAdmin:false,mode:'employee',
           view:'home',vid:null,histDate:dkey(),vtab:'hist',form:null,me:'',profile:null,err:null};

/* ================= INITIALISATION FIREBASE ================= */
function init(){
  document.getElementById('today').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  if(typeof firebase==='undefined'||!window.FIREBASE_CONFIG||!FIREBASE_CONFIG.apiKey){
    $app.innerHTML='<div class="banner bad">Configuration Firebase manquante : collez votre configuration dans <b>firebase-config.js</b> (voir le guide).</div>';return}
  firebase.initializeApp(FIREBASE_CONFIG);
  P.auth=firebase.auth();P.db=firebase.firestore();
  P.db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  P.db.doc('config/setup').onSnapshot(s=>{S.setupDone=s.exists;if(S.view==='login'){const l=document.getElementById('setupLink');if(l)l.hidden=S.setupDone}},()=>{});
  P.auth.onAuthStateChanged(u=>{

function subscribe(){

  const onErr=name=>e=>{console.warn(name,e);S.err='Erreur de chargement ('+name+') : '+(e&&e.code||'inconnue');soft()};

/* ================= PHOTOS ================= */
const photoCache={};
function loadImage(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{res(i)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Image illisible'))};i.src=u})}
async function processPhoto(file,label,max,q){
  const img=await loadImage(file);
  let w=img.naturalWidth,h=img.naturalHeight;const sc=Math.min(1,max/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);
  // tampon date / heure / véhicule sur la photo (preuve)
  const fs=Math.max(14,Math.round(w/40));x.font='bold '+fs+'px sans-serif';
  const txt=label+' • '+new Date().toLocaleString('fr-FR');const tw=x.measureText(txt).width;
  x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,h-fs*1.8,tw+fs,fs*1.8);x.fillStyle='#fff';x.fillText(txt,fs/2,h-fs*0.55);
  return c;
}
const toBlob=(c,q)=>new Promise(r=>c.toBlob(r,'image/jpeg',q));
async function savePhoto(file,label){
  let max=1400,q=.72,data='';
  for(let i=0;i<7;i++){const c=await processPhoto(file,label,max);data=c.toDataURL('image/jpeg',q);if(data.length<420000)break;max=Math.round(max*.85);q=Math.max(.45,q-.06)}
  const ref=P.db.collection('photos').doc();await ref.set({d:data,uid:P.uid,t:Date.now()});photoCache['p:'+ref.id]=data;return {p:ref.id};
}
function phKey(r){return r?(r.u?'u:'+r.s:r.a?'a:'+r.a:'p:'+r.p):''}
function imgTag(r,cls='',cap=''){
  if(!r)return '<div class="none">—</div>';
  const k=phKey(r);const src=r.u?r.u:(photoCache[k]||'');
  return `<img class="${cls}" data-ph="${esc(k)}" ${src?`src="${esc(src)}"`:''} data-act="lightbox" data-cap="${esc(cap)}" alt="${esc(cap)}" loading="lazy" onerror="this.style.opacity=.3">`;
}
async function hydrate(){
  const els=[...document.querySelectorAll('img[data-ph^="p:"]:not([src])')];
  for(const el of els){const k=el.dataset.ph;const id=k.slice(2);
    if(!photoCache[k]){try{const s=await P.db.doc('photos/'+id).get();photoCache[k]=s.exists?s.data().d:''}catch(e){photoCache[k]=''}}
    if(photoCache[k])document.querySelectorAll(`img[data-ph="${k}"]`).forEach(i=>i.src=photoCache[k]);
  }
}

/* ================= DONNÉES DÉRIVÉES ================= */
const vById=id=>S.vehicles.find(v=>v.id===id);
const inspOf=(vid,type,date)=>S.inspections.filter(i=>i.vehicleId===vid&&(!type||i.type===type)&&(!date||i.date===date));
function curKm(v){let k=Number(v.km)||0;S.inspections.forEach(i=>{if(i.vehicleId===v.id&&Number(i.km)>k)k=Number(i.km)});return k}
function lastQuinz(vid){return inspOf(vid,'quinzaine')[0]||null}
function quinzStatus(vid){const l=lastQuinz(vid);if(!l)return{cls:'bad',txt:'Contrôle 15 j jamais fait',due:true};
  const d=daysBetween(l.date,dkey());const rest=15-d;
  if(rest<0)return{cls:'bad',txt:'Contrôle 15 j en retard ('+(-rest)+' j)',due:true};
  if(rest<=2)return{cls:'warn',txt:'Contrôle 15 j dans '+rest+' j',due:true};
  return{cls:'ok',txt:'Contrôle 15 j OK ('+rest+' j restants)',due:false};}
function pbCount(i){return Object.values(i.checks||{}).filter(c=>c.s&&c.s!=='ok').length}
function maintItems(vid){
  const v=vById(vid);const km=v?curKm(v):0;const m=(S.maint[vid]&&S.maint[vid].items)||{};const today=dkey();
  return MAINT.map(([k,lbl,ik,id])=>{const it=m[k]||{};const intKm=it.intKm!==undefined?it.intKm:ik;const intD=it.intDays!==undefined?it.intDays:id;
    let st='none',nextKm=null,nextDate=null,remKm=null,remD=null;
    if(it.lastDate||it.lastKm!=null){st='ok';
      if(intKm&&it.lastKm!=null){nextKm=Number(it.lastKm)+Number(intKm);remKm=nextKm-km;if(remKm<0)st='bad';else if(remKm<=1500&&st!=='bad')st='warn'}
      if(intD&&it.lastDate){nextDate=addDays(it.lastDate,Number(intD));remD=daysBetween(today,nextDate);if(remD<0)st='bad';else if(remD<=30&&st==='ok')st='warn'}
    }
    return{k,lbl,intKm,intD,last:it,nextKm,nextDate,remKm,remD,st,km};});
}
function maintAlerts(vid){return maintItems(vid).filter(x=>x.st==='bad'||x.st==='warn')}

function itemLabel(type,key){const [sid,k]=key.split('.');const s=(TYPES[type]?.sections||[]).find(x=>x.id===sid);const it=s&&s.items.find(x=>x[0]===k);return it?it[1]:key}
function pbList(i){return Object.entries(i.checks||{}).filter(([k,c])=>c.s&&c.s!=='ok').map(([k,c])=>({lbl:itemLabel(i.type,k),s:c.s,c:c.c}))}

    h+=`</div>`;
  }

function inspCard(i){

  if(pbs.length)h+=`<ul class="pbl">${pbs.map(p=>`<li class="${p.s==='def'?'def':''}">${p.s==='manque'?'❌ Manquant':p.s==='def'?'⚠ Défectueux':'⚠ Problème'} : <b>${esc(p.lbl)}</b>${p.c?`<small>💬 ${esc(p.c)}</small>`:''}</li>`).join('')}</ul>`;
  if(i.extra&&i.extra.length)h+=`<div class="small" style="font-weight:700;margin:8px 0 6px">Photos supplémentaires</div><div class="thumbs">${i.extra.map(r=>imgTag(r,'','Photo supplémentaire')).join('')}</div>`;

/* ---------- Admin : maintenance ---------- */
function maintTable(vid){
  const v=vById(vid);const items=maintItems(vid);
  let h=`<div class="card"><div class="small muted" style="margin-bottom:8px">Kilométrage actuel : <b>${nf(curKm(v))} km</b> (dernier relevé des contrôles). Touchez « Fait » après chaque intervention, et « ✎ » pour changer l’intervalle.</div><div class="tw"><table><thead><tr><th>Entretien</th><th>Dernier</th><th>Prochain</th><th></th></tr></thead><tbody>`;
  for(const x of items){
    const stc={ok:'ok',warn:'warn',bad:'bad',none:''}[x.st];const stt={ok:'OK',warn:'Bientôt',bad:'En retard',none:'À renseigner'}[x.st];
    const nxt=[x.nextKm!=null?nf(x.nextKm)+' km'+(x.remKm!=null?` <span class="small muted">(${x.remKm<0?'dépassé de '+nf(-x.remKm):'dans '+nf(x.remKm)} km)</span>`:''):'',x.nextDate?esc(fmtD(x.nextDate))+(x.remD!=null?` <span class="small muted">(${x.remD<0?'retard '+(-x.remD)+' j':'dans '+x.remD+' j'})</span>`:''):''].filter(Boolean).join('<br>')||'—';
    h+=`<tr><td><b>${esc(x.lbl)}</b><div class="small muted">tous les ${[x.intKm?nf(x.intKm)+' km':'',x.intD?x.intD+' jours':''].filter(Boolean).join(' ou ')||'—'}</div><span class="chip ${stc}" style="margin-top:4px;display:inline-block">${stt}</span></td>
    <td class="small">${x.last.lastDate?esc(fmtD(x.last.lastDate)):'—'}${x.last.lastKm!=null?'<br>'+nf(x.last.lastKm)+' km':''}${x.last.note?`<div class="muted">${esc(x.last.note)}</div>`:''}</td><td class="small">${nxt}</td>
    <td style="white-space:nowrap"><button class="btn green sm" data-act="maintDone" data-v="${vid}" data-k="${x.k}">Fait</button> <button class="btn ghost sm" data-act="maintInt" data-v="${vid}" data-k="${x.k}">✎</button></td></tr>`;
  }
  return h+`</tbody></table></div></div>`;
}
function vMaint(){
  let h=`<h2>Planning de maintenance préventive</h2>`;
  if(!S.vehicles.length)return h+`<div class="empty">Ajoutez d’abord des véhicules.</div>`;
  const all=[];S.vehicles.forEach(v=>maintItems(v.id).forEach(x=>{if(x.st!=='ok')all.push({v,x})}));
  const rank={bad:0,warn:1,none:2};all.sort((a,b)=>rank[a.x.st]-rank[b.x.st]);
  h+=`<div class="card"><h3 style="margin-top:0">À prévoir</h3>`;
  const urg=all.filter(a=>a.x.st!=='none');
  if(!urg.length)h+=`<div class="muted">Aucun entretien en retard ou proche. 👍</div>`;
  urg.forEach(({v,x})=>h+=`<div class="lrow" data-act="openV" data-id="${v.id}" data-tab="m"><span class="dot ${x.st}"></span><div style="flex:1"><b>${esc(v.name)}</b> · ${esc(x.lbl)}<div class="small muted">${x.st==='bad'?'En retard':'Bientôt'} · ${x.nextKm!=null?'prévu à '+nf(x.nextKm)+' km':''} ${x.nextDate?'· le '+esc(fmtD(x.nextDate)):''}</div></div><span class="muted">›</span></div>`);
  const nn=all.filter(a=>a.x.st==='none').length;
  if(nn)h+=`<div class="small muted" style="margin-top:8px">${nn} entretien(s) jamais renseigné(s) : ouvrez chaque véhicule pour saisir la date et le kilométrage de la dernière intervention.</div>`;
  h+=`</div>`;
  S.vehicles.forEach(v=>{h+=`<h3>🚑 ${esc(v.name)} <span class="muted small">${esc(v.plate||'')}</span></h3>`+maintTable(v.id)});
  return h;
}

function errMsg(e){const F={'permission-denied':'Action non autorisée pour votre compte','unavailable':'Pas de connexion internet','auth/email-already-in-use':'Cet e-mail est déjà utilisé','auth/invalid-email':'E-mail invalide','auth/weak-password':'Mot de passe trop court (6 caractères min.)','auth/invalid-credential':'E-mail ou mot de passe incorrect','auth/wrong-password':'E-mail ou mot de passe incorrect','auth/user-not-found':'E-mail ou mot de passe incorrect','auth/too-many-requests':'Trop d’essais, réessayez plus tard','auth/network-request-failed':'Pas de connexion internet','storage/unauthorized':'Envoi de photo refusé','storage/retry-limit-exceeded':'Connexion trop lente pour envoyer la photo'};if(e&&F[e.code])return F[e.code];const c=e&&e.code;if(c==='invalid_argument'&&!P.canWrite)return'Accès en lecture seule';if(c==='quota_exceeded')return'Espace de stockage plein : supprimez d’anciens contrôles';if(c==='invalid_argument')return'Action refusée (droits insuffisants ?)';return'Erreur : '+(c||e&&e.message||'inconnue')}

    modal(`<h3>🔧 ${esc(lbl)}</h3><p class="small muted">${esc(v.name)}</p><div class="row2"><div><label class="f">Date de l’intervention</label><input type="date" id="mdD" value="${dkey()}"></div><div><label class="f">Kilométrage</label><input type="number" id="mdK" value="${curKm(v)}" inputmode="numeric"></div></div>
    <label class="f">Note (garage, pièces, coût…)</label><input type="text" id="mdN"><div class="mact"><button class="btn ghost" data-act="closeM">Annuler</button><button class="btn green" id="mdSave">Enregistrer</button></div>`);
    document.getElementById('mdSave').onclick=()=>{const it={...((S.maint[vid]&&S.maint[vid].items&&S.maint[vid].items[k])||{}),lastDate:document.getElementById('mdD').value,lastKm:Number(document.getElementById('mdK').value)||0,note:document.getElementById('mdN').value.trim()};saveMaint(vid,k,it)}},
  maintInt(t){const vid=t.dataset.v,k=t.dataset.k;const x=maintItems(vid).find(i=>i.k===k);
    modal(`<h3>Intervalle – ${esc(x.lbl)}</h3><div class="row2"><div><label class="f">Tous les (km)</label><input type="number" id="miK" value="${x.intKm||''}" placeholder="aucun"></div><div><label class="f">Tous les (jours)</label><input type="number" id="miD" value="${x.intD||''}" placeholder="aucun"></div></div>
    <div class="mact"><button class="btn ghost" data-act="closeM">Annuler</button><button class="btn" id="miSave">Enregistrer</button></div>`);
    document.getElementById('miSave').onclick=()=>{const it={...((S.maint[vid]&&S.maint[vid].items&&S.maint[vid].items[k])||{}),intKm:Number(document.getElementById('miK').value)||null,intDays:Number(document.getElementById('miD').value)||null};saveMaint(vid,k,it)}}
};
function saveMaint(vid,k,it){const cur=S.maint[vid]||{};const items={...(cur.items||{}),[k]:it};safe(async()=>{await P.db.doc('maintenance/'+vid).set({items,updatedAt:Date.now()});closeModal()},'Enregistré')}
function confirmCancel(){modal(`<h3>Annuler le contrôle ?</h3><p>Les informations saisies seront perdues.</p><div class="mact"><button class="btn ghost" data-act="closeM">Continuer la saisie</button><button class="btn red" id="cxYes">Annuler le contrôle</button></div>`);
  document.getElementById('cxYes').onclick=()=>{layer.innerHTML='';S.form=null;S.view=S.mode==='admin'?'dash':'home';render()}}

async function submitForm(){
  const f=S.form;const p=progress();
  if(!p.ok){toast('Incomplet : '+p.parts.join(', '),true);
    const first=TYPES[f.type].sections.find(s=>s.items.some(([k])=>{const c=f.checks[s.id+'.'+k];return!c||!c.s||(c.s!=='ok'&&!(c.c||'').trim())}));
    if(first){const el=document.getElementById('sec-'+first.id);el.classList.remove('closed');el.scrollIntoView({behavior:'smooth',block:'start'})}return}
  const v=vById(f.vid);
  if(TYPES[f.type].km){const km=Number(f.km);
    const dep=inspOf(v.id,'depart',dkey())[0];if(f.type==='retour'&&dep&&dep.km&&km<dep.km)return toast('Le kilométrage du retour est inférieur à celui du départ',true)}
  const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Enregistrement…';
  const doc={vehicleId:f.vid,vehicleName:v.name,type:f.type,date:dkey(),createdAt:Date.now(),employee:S.me,uid:P.uid,checks:f.checks,comment:f.comment.trim()};
  if(TYPES[f.type].photos){doc.photos=f.photos;doc.extra=f.extra}
  if(TYPES[f.type].km){doc.km=Number(f.km);doc.fuel=f.fuel}
  try{await P.db.collection('inspections').doc().set(doc);
    const pb=pbCount(doc);S.form=null;S.view=S.mode==='admin'?'dash':'home';render();window.scrollTo(0,0);
    toast(pb?'Contrôle enregistré – '+pb+' problème(s) signalé(s) à l’admin':'Contrôle enregistré ✓');
  }catch(e){console.warn(e);btn.disabled=false;btn.textContent='Valider le contrôle';toast(errMsg(e),true)}
}

/* ================= ÉVÉNEMENTS ================= */
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=ACT[t.dataset.act];if(a){a(t,e)}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.com&&S.form){const k=t.dataset.com;const c=S.form.checks[k]||{};c.c=t.value;S.form.checks[k]=c;progress()}
  if(t.dataset.chg&&S.form&&['km','fuel','comment'].includes(t.dataset.chg)){S.form[t.dataset.chg]=t.value;progress()}
});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.dataset.chg==='histDate'){if(t.value){S.histDate=t.value;render()}return}
  if(t.dataset.chg&&S.form&&['km','fuel','comment'].includes(t.dataset.chg)){S.form[t.dataset.chg]=t.value;progress();return}
  if(t.dataset.photo&&S.form){
    const file=t.files&&t.files[0];if(!file)return;const k=t.dataset.photo;const f=S.form;const v=vById(f.vid);
    const label=(v?v.name:'')+' • '+TYPES[f.type].lbl+(k!=='__extra'?' • '+ANGLES.find(a=>a[0]===k)[1]:'');
    const slot=k==='__extra'?null:document.getElementById('slot-'+k);slot&&slot.classList.add('busy');f.busy++;progress();
    try{const ref=await savePhoto(file,label);if(S.form!==f)return;if(k==='__extra'){f.extra.push(ref);paintExtra()}else{f.photos[k]=ref;paintSlot(k)}toast('Photo ajoutée ✓')}
    catch(err){console.warn(err);toast('Photo non enregistrée : '+errMsg(err),true)}
    finally{f.busy--;slot&&slot.classList.remove('busy');t.value='';progress()}
  }
});
document.addEventListener('submit',e=>{if(e.target.id!=='loginForm')return;e.preventDefault();
  const em=document.getElementById('lgE').value.trim(),pw=document.getElementById('lgP').value;if(!em||!pw)return toast('E-mail et mot de passe obligatoires',true);
  safe(()=>P.auth.signInWithEmailAndPassword(em,pw))});
window.addEventListener('online',()=>soft());window.addEventListener('offline',()=>soft());
init();
</script>
</body>
</html>
